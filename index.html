    body=`<div class="card"><div class="tbl-wrap"><table class="lines"><thead><tr><th style="min-width:200px">Producto</th><th style="width:70px" class="r">Cant.</th><th style="width:110px" class="r">P. unit (Bs)</th><th class="r" style="width:100px">Subtotal</th><th class="r" style="width:90px">Costo</th><th style="width:30px"></th></tr></thead><tbody id="lnBody">
      ${c.items.map(i=>`<tr data-li="${i.id}"><td><select data-f="product_id"><option value="">— Línea libre —</option>${DB.products.filter(p=>p.active!==false||p.id===i.product_id).map(p=>`<option value="${p.id}" ${i.product_id===p.id?'selected':''}>${esc((p.code?p.code+' · ':'')+p.name+(p.variant?' ('+p.variant+')':''))}</option>`).join('')}</select>
        <input data-f="description" value="${esc(i.description||'')}" placeholder="Descripción / personalización" style="margin-top:4px"></td>
        <td><input data-f="qty" type="number" min="0" step="1" value="${N(i.qty)}" class="r"></td><td><input data-f="unit_price_bs" type="number" min="0" step="0.5" value="${N(i.unit_price_bs)}"></td>
        <td class="r b">${fmtBs(N(i.qty)*N(i.unit_price_bs))}</td><td class="r muted small">${fmtBs(N(i.qty)*N(i.unit_cost_bs))}</td><td><button class="x" data-rmli="${i.id}" aria-label="Quitar">×</button></td></tr>`).join('')}
      </tbody></table></div>
      <div style="padding:10px 12px" class="row wrap"><button class="btn sm ghost" id="liAdd">＋ Agregar producto</button><span class="spacer"></span>
        <label class="small t2 row" style="gap:6px">Descuento Bs <input class="inp" id="dDisc" type="number" min="0" step="1" value="${N(d.discount_bs)}" style="width:90px;min-height:34px;padding:5px 8px"></label>
        <label class="small t2 row" style="gap:6px">Envío Bs <input class="inp" id="dShip" type="number" min="0" step="1" value="${N(d.shipping_bs)}" style="width:90px;min-height:34px;padding:5px 8px"></label></div>
      ${!c.items.length?`<div style="padding:0 12px 12px"><label class="small t2 row" style="gap:6px">Sin productos: monto manual Bs <input class="inp" id="dManual" type="number" min="0" step="1" value="${d.amount_manual_bs==null?'':N(d.amount_manual_bs)}" style="width:120px;min-height:34px;padding:5px 8px"></label></div>`:''}</div>
    <div class="calc-box mt"><div class="calc-row"><span>Subtotal</span><span class="v">${fmtBs(c.sub)}</span></div>${N(d.discount_bs)?`<div class="calc-row"><span>Descuento</span><span class="v">− ${fmtBs(d.discount_bs)}</span></div>`:''}${N(d.shipping_bs)?`<div class="calc-row"><span>Envío</span><span class="v">${fmtBs(d.shipping_bs)}</span></div>`:''}
      <div class="calc-row total"><span>Total al cliente</span><span class="v">${fmtBs(c.total)}</span></div>
      <div class="metrics"><div class="m"><div class="k">Costo</div><div class="v">${fmtBs(c.cost,0)}</div></div><div class="m"><div class="k">Margen</div><div class="v" style="color:${c.margin>=0?'var(--pos)':'var(--neg)'}">${c.net>0?fmtPct(c.marginPct):'—'}</div></div><div class="m"><div class="k">Bs/h</div><div class="v acc-t">${c.hours?fmtN(c.bsh,0):'—'}</div></div></div>
      <div class="hint" style="margin-top:8px">Costo, horas y gramos se congelan al agregar la línea. El cliente solo ve imagen y precio.</div></div>`;
  }
  if(dealTab==='cobros'){
    const ps=paymentsOf(d.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    body=`<div class="row between mb"><div><div class="small t2">Cobrado ${fmtBs(c.paid)} de ${fmtBs(c.total)}</div><div class="progress lg" style="width:260px;margin-top:6px"><i style="width:${c.total>0?Math.min(100,c.paid/c.total*100):0}%;background:var(--pos)"></i></div></div><button class="btn sm" id="payAdd">＋ Registrar cobro</button></div>
      ${ps.length?`<div class="card"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Método</th><th>Nota</th><th class="r">Monto</th></tr></thead><tbody>${ps.map(p=>`<tr class="click" data-pay="${p.id}"><td>${fmtDate(p.date)}</td><td>${esc(p.kind||'pago')}</td><td>${esc(p.method||'—')}</td><td class="small muted">${esc(p.note||'')}</td><td class="r b">${fmtBs(p.amount_bs)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('cash','Sin cobros','El ingreso se reconoce cuando entra la plata, no al cotizar.')}`;
  }
  if(dealTab==='produccion'){
    const js=DB.jobs.filter(j=>j.deal_id===d.id);
    body=`<div class="row between mb"><div class="small t2">${fmtN(c.hours,1)} h de impresora estimadas · ${fmtN(c.grams)} g de filamento</div><div class="row"><button class="btn sm ghost" id="jobsGen">Generar trabajos desde productos</button><button class="btn sm" id="jobAdd">＋ Trabajo</button></div></div>
      ${js.length?`<div class="card"><table><thead><tr><th>Trabajo</th><th>Turno</th><th>Fecha</th><th class="r">Horas</th><th>Estado</th></tr></thead><tbody>${js.map(j=>`<tr class="click" data-job="${j.id}"><td><b>${esc(j.title)}</b><div class="sub">${fmtN(j.qty)} uds · ${fmtN(j.grams)} g</div></td><td class="small">${esc((SLOTS[j.slot]||'').split(' (')[0])}</td><td class="small">${fmtDate(j.date)}</td><td class="r">${fmtN(j.hours,1)}</td><td>${jobTag(j.status)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('printer','Sin trabajos de impresión','Genera los trabajos a partir de los productos del pedido.')}`;
  }
  if(dealTab==='actividad'){body=activityBlock({deal_id:d.id,contact_id:d.contact_id});}
  const phone=ct&&ct.phone;
  return `<div class="drawer-h"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="small muted">Pedido #${d.number||'·'} · ${divTag(d.division)}</div><h2>${esc(d.title)}</h2></div><button class="x" id="drX" aria-label="Cerrar">×</button></div>
    <div class="row wrap" style="margin-top:10px;gap:8px">
      ${phone?`<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(phone,quoteText(d))}">${ic('wa',15)} Enviar cotización</a>`:`<button class="btn sm wa" id="waNoPhone">${ic('wa',15)} WhatsApp</button>`}
      <button class="btn sm ghost" id="pdfBtn">${ic('file',15)} Cotización PDF</button>
      <button class="btn sm ghost" id="dPay">${ic('cash',15)} Cobro</button>
      <button class="btn sm ghost" id="dMore">Más ▾</button></div>
    <div class="stage-bar">${STAGES.map((s,i)=>`<button data-st="${s.k}" class="${s.k===d.stage?'on':''} ${d.stage!=='perdido'&&i<idx&&s.k!=='perdido'?'done':''} ${s.k==='perdido'?'lost':''}">${s.n.split(' /')[0]}</button>`).join('')}</div></div>
    <div class="drawer-b"><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${dealTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${body}</div>`;
}
function bindDealDrawer(d){
  const dr=$('#drawer');$('#drX').onclick=()=>closeDrawer();
  $$('[data-tab]',dr).forEach(b=>b.onclick=()=>{dealTab=b.dataset.tab;drawerRefresh();});
  $$('[data-st]',dr).forEach(b=>b.onclick=()=>moveStage(d.id,b.dataset.st));
  $('#pdfBtn').onclick=()=>quotePDF(d.id);
  $('#dPay').onclick=()=>openPayment(null,d.id);
  const np=$('#waNoPhone');if(np)np.onclick=()=>{toast('El contacto no tiene WhatsApp cargado','err');};
  $('#dMore').onclick=e=>openMenu(e.currentTarget,[
    {t:'Editar datos',i:'note',f:()=>openDealForm(d.id)},
    {t:'Copiar texto de la cotización',i:'file',f:()=>{navigator.clipboard&&navigator.clipboard.writeText(quoteText(d));toast('Texto copiado');}},
    {t:'Mensaje de seguimiento',i:'wa',f:()=>{const ct=byId('contacts',d.contact_id);if(!ct||!ct.phone){toast('Sin WhatsApp','err');return;}window.open(waLink(ct.phone,fillTpl(S.tplFollow,{nombre:ct.name.split(' ')[0],titulo:d.title})),'_blank');logWa(d,'Seguimiento enviado');}},
    {t:'Mensaje post-venta (pedir foto)',i:'heart',f:()=>{const ct=byId('contacts',d.contact_id);if(!ct||!ct.phone){toast('Sin WhatsApp','err');return;}window.open(waLink(ct.phone,fillTpl(S.tplDelivered,{nombre:ct.name.split(' ')[0]})),'_blank');logWa(d,'Post-venta: pedido de foto/reseña');}},
    {t:'Duplicar pedido',i:'plus',f:()=>duplicateDeal(d)},'-',
    {t:'Eliminar',i:'alert',f:async()=>{if(await confirmDlg('¿Eliminar <b>'+esc(d.title)+'</b>?')){await delDeal(d.id);closeDrawer();toast('Eliminado');}}}]);
  const wl=dr.querySelector('a.wa');if(wl)wl.addEventListener('click',()=>{logWa(d,'Cotización enviada por WhatsApp');if(d.stage==='nuevo')moveStage(d.id,'cotizado');});
  $$('[data-open-contact]',dr).forEach(b=>b.onclick=()=>openContactView(b.dataset.openContact));
  $$('[data-open-company]',dr).forEach(b=>b.onclick=()=>openCompanyView(b.dataset.openCompany));
  // colaboradoras
  const ca=$('#dcAdd');if(ca)ca.onclick=()=>{const opts=DB.team.filter(m=>m.active!==false&&m.role==='colaboradora');if(!opts.length){toast('No hay colaboradoras en Ajustes → Equipo','err');return;}
    openModal({title:'Agregar colaboradora',body:`<div class="form-grid"><div class="field"><label>Persona</label><select id="cm">${opts.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>% del margen neto</label><input id="cp" type="number" min="0" max="100" step="1" value="${opts[0].margin_pct||S.defaultMarginPct}"></div></div>`,
      onSave:async()=>{const list=(d.collaborators||[]).filter(x=>x.member_id!==val('cm'));list.push({member_id:val('cm'),pct:numv('cp')||0});await save('deals',{...d,collaborators:list});closeModal();drawerRefresh();}});
    $('#cm').onchange=e=>{const m=byId('team',e.target.value);$('#cp').value=m&&m.margin_pct||S.defaultMarginPct;};};
  $$('[data-rmcol]',dr).forEach(b=>b.onclick=async()=>{const list=(d.collaborators||[]).slice();list.splice(+b.dataset.rmcol,1);await save('deals',{...d,collaborators:list});drawerRefresh();});
  const ta=$('#dtAdd');if(ta)ta.onclick=()=>openTask(null,{deal_id:d.id,contact_id:d.contact_id,assignee_id:d.owner_id});
  bindTaskRows(dr);
  // líneas
  const la=$('#liAdd');if(la)la.onclick=()=>pickProduct(async p=>{await addLine(d,p);drawerRefresh();});
  $$('#lnBody tr',dr).forEach(tr=>{const it=byId('items',tr.dataset.li);
    $$('[data-f]',tr).forEach(inp=>inp.onchange=async()=>{const f=inp.dataset.f;let v=inp.value;const row={...it};
      if(f==='product_id'){const p=byId('products',v);row.product_id=v||null;if(p){const c=costOf(p);Object.assign(row,{unit_price_bs:N(p.price_bs),unit_cost_bs:+c.total.toFixed(2),unit_hours:N(p.print_time_h),unit_grams:N(p.weight_g),description:row.description||''});}}
      else row[f]=f==='description'?v:Number(v)||0;
      await save('items',row);drawerRefresh();});});
  $$('[data-rmli]',dr).forEach(b=>b.onclick=async()=>{await del('items',b.dataset.rmli);drawerRefresh();});
  const dd=$('#dDisc');if(dd)dd.onchange=async()=>{await save('deals',{...d,discount_bs:Number(dd.value)||0});drawerRefresh();};
  const ds=$('#dShip');if(ds)ds.onchange=async()=>{await save('deals',{...d,shipping_bs:Number(ds.value)||0});drawerRefresh();};
  const dm=$('#dManual');if(dm)dm.onchange=async()=>{await save('deals',{...d,amount_manual_bs:dm.value===''?null:Number(dm.value)});drawerRefresh();};
  // cobros / producción
  const pa=$('#payAdd');if(pa)pa.onclick=()=>openPayment(null,d.id);
  $$('[data-pay]',dr).forEach(r=>r.onclick=()=>openPayment(r.dataset.pay));
  const jg=$('#jobsGen');if(jg)jg.onclick=()=>openJobsFromDeal(d.id);
  const jadd=$('#jobAdd');if(jadd)jadd.onclick=()=>openJob(null,{deal_id:d.id,title:d.title});
  $$('[data-job]',dr).forEach(r=>r.onclick=()=>openJob(r.dataset.job));
  bindActivity(dr,{deal_id:d.id,contact_id:d.contact_id});
}
async function addLine(d,p){const c=costOf(p);await save('items',{deal_id:d.id,product_id:p.id,description:'',qty:1,unit_price_bs:N(p.price_bs),unit_cost_bs:+c.total.toFixed(2),unit_hours:N(p.print_time_h),unit_grams:N(p.weight_g),sort:itemsOf(d.id).length});
  if(itemsOf(d.id).length===1&&d.division!==p.division)await save('deals',{...d,division:p.division});}
async function duplicateDeal(d){const nd=await save('deals',{...d,id:null,number:undefined,title:d.title+' (copia)',stage:'nuevo',stage_changed_at:nowISO(),closed_at:null,created_at:null,lost_reason:null});
  for(const i of itemsOf(d.id))await save('items',{...i,id:null,created_at:null,deal_id:nd.id});toast('Pedido duplicado');openDeal(nd.id);}
function pickProduct(cb){
  openModal({title:'Agregar producto',wide:true,noFoot:true,body:`<input class="inp" id="ppq" placeholder="Buscar por nombre o código" style="margin-bottom:12px"><div id="ppList" style="max-height:60vh;overflow-y:auto"></div>`});
  const paint=()=>{const q=val('ppq').toLowerCase();const ps=DB.products.filter(p=>p.active!==false&&(!q||p.name.toLowerCase().includes(q)||String(p.code||'').toLowerCase().includes(q)));
    $('#ppList').innerHTML=ps.map(p=>{const c=costOf(p);return `<div class="list-row" style="cursor:pointer" data-pp="${p.id}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:cover">`:`<span class="div-dot" style="background:${DIV[p.division].css}"></span>`}<div style="min-width:0;flex:1"><div class="b ell">${esc(p.name)}${p.variant?' <span class="muted">('+esc(p.variant)+')</span>':''}</div><div class="xs muted">${p.code?esc(p.code)+' · ':''}${DIV[p.division].s}${c.bsh?' · Bs '+fmtN(c.bsh,0)+'/h':''}</div></div><span class="price-pill">Bs ${fmtN(p.price_bs)}</span></div>`;}).join('')||emptyBox('box','Sin productos','');
    $$('[data-pp]').forEach(el=>el.onclick=()=>{closeModal();cb(byId('products',el.dataset.pp));});};
  $('#ppq').oninput=paint;paint();
}
function logWa(d,body){save('activities',{type:'whatsapp',body,deal_id:d.id,contact_id:d.contact_id,author:ME.name,at:nowISO()});}
function quoteText(d){const ct=byId('contacts',d.contact_id),c=dealCalc(d);
  const lines=c.items.map(i=>{const p=byId('products',i.product_id);return `• ${fmtN(i.qty)} × ${p?p.name+(p.variant?' ('+p.variant+')':''):i.description||'Producto'}${i.description&&p?' – '+i.description:''} — Bs ${fmtN(N(i.qty)*N(i.unit_price_bs))}`;}).join('\n')||'• '+d.title;
  const plazo=d.delivery_date?fmtDate(d.delivery_date):S.leadTime+' días hábiles desde el anticipo';
  return fillTpl(S.tplQuote,{nombre:ct?ct.name.split(' ')[0]:'',numero:d.number||'',lineas:lines,total:fmtBs(c.total),plazo,titulo:d.title});}

/* ---------- Cotización PDF (imagen + precio, poco texto) ---------- */
function quotePDF(id){
  const d=byId('deals',id),c=dealCalc(d),ct=byId('contacts',d.contact_id),co=byId('companies',d.company_id);
  const cards=c.items.map(i=>{const p=byId('products',i.product_id);const name=p?p.name:(i.description||'Producto');
    return `<div class="qc"><div class="qi">${p&&p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:`<div class="ph">${KAS_SVG}</div>`}</div><div class="qb"><div class="qn">${esc(name)}</div><div class="qv">${esc([p&&p.variant,i.description&&p?i.description:''].filter(Boolean).join(' · '))}</div><div class="qr"><span class="qq">${fmtN(i.qty)} ${N(i.qty)===1?'unidad':'unidades'}</span><span class="pill">Bs ${fmtN(N(i.qty)*N(i.unit_price_bs))}</span></div></div></div>`;}).join('')
    ||`<div class="qc"><div class="qi"><div class="ph">${KAS_SVG}</div></div><div class="qb"><div class="qn">${esc(d.title)}</div><div class="qr"><span></span><span class="pill">Bs ${fmtN(c.total)}</span></div></div></div>`;
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cotización KASTOR #${d.number||''}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@600;800;900&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Montserrat,sans-serif;background:#FAF6F2;color:#14234B;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg{width:297mm;min-height:210mm;padding:14mm 16mm;display:flex;flex-direction:column}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #14234B;padding-bottom:6mm}
  .brand{display:flex;align-items:center;gap:4mm}.brand svg{width:13mm;image-rendering:pixelated}.wm{font-family:'Sofia Sans';font-weight:900;font-size:30pt;letter-spacing:.08em;line-height:1}.lm{font-size:7pt;letter-spacing:.3em;color:#E57D37;font-weight:700;margin-top:1mm}
  .meta{text-align:right;font-size:9pt;line-height:1.6}.meta b{font-family:'Sofia Sans';font-size:15pt;font-weight:800;display:block;letter-spacing:.04em}
  .to{margin:6mm 0 5mm;font-size:10pt}.to b{font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5mm;flex:1;align-content:start}
  .qc{background:#fff;border-radius:4mm;overflow:hidden;box-shadow:0 1mm 4mm rgba(20,35,75,.08);display:flex;flex-direction:column}
  .qi{aspect-ratio:1/1;background:#F3EDE6;position:relative}.qi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.qi .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.qi .ph svg{width:30%;opacity:.5}
  .qb{padding:3.5mm 4mm 4mm;display:flex;flex-direction:column;gap:1mm;flex:1}.qn{font-weight:700;font-size:10.5pt;line-height:1.25;text-transform:uppercase}.qv{font-size:8pt;color:#4C5875;min-height:3mm}
  .qr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:2mm}.qq{font-size:8pt;color:#4C5875}
  .pill{background:#E57D37;color:#fff;font-family:'Sofia Sans';font-weight:800;font-size:12pt;border-radius:20mm;padding:1mm 4mm}
  .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6mm;padding-top:5mm;border-top:1px solid #D8CBBD}
  .tot{display:flex;align-items:center;gap:4mm;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10pt}.tot .pill{font-size:20pt;padding:1.5mm 7mm;background:#14234B}
  .cond{font-size:8pt;color:#4C5875;line-height:1.6;max-width:150mm}
  @media screen{body{padding:20px 0}.pg{margin:0 auto;background:#FAF6F2;box-shadow:0 10px 40px rgba(0,0,0,.15)}.bar{text-align:center;margin-bottom:14px}.bar button{font-family:Montserrat;font-weight:700;background:#E57D37;color:#fff;border:0;border-radius:10px;padding:10px 20px;cursor:pointer}}
  @media print{.bar{display:none}}</style></head><body>
  <div class="bar"><button onclick="print()">Guardar como PDF / imprimir</button></div>
  <div class="pg"><div class="hd"><div class="brand">${KAS_SVG}<div><div class="wm">KASTOR</div><div class="lm">CREA · APRENDE · CONSTRUYE</div></div></div>
  <div class="meta"><b>COTIZACIÓN #${d.number||''}</b>${fmtDate(todayISO())} · válida ${S.quoteValidity} días</div></div>
  <div class="to">Para <b>${esc(ct?ct.name:(co?co.name:'—'))}</b>${co&&ct?' · '+esc(co.name):''}</div>
  <div class="grid">${cards}</div>
  <div class="ft"><div class="cond">Entrega: ${d.delivery_date?fmtDate(d.delivery_date):S.leadTime+' días hábiles desde el anticipo'} · Anticipo 50% para iniciar${N(d.discount_bs)?' · Descuento aplicado Bs '+fmtN(d.discount_bs):''}${N(d.shipping_bs)?' · Envío Bs '+fmtN(d.shipping_bs):''}<br>${S.whatsappBiz?'WhatsApp '+esc(S.whatsappBiz):''}${S.instagram?' · '+esc(S.instagram):''}</div>
  <div class="tot">Total <span class="pill">Bs ${fmtN(c.total)}</span></div></div></div></body></html>`;
  const w=window.open('','_blank');if(!w){toast('El navegador bloqueó la ventana emergente','err');return;}w.document.write(html);w.document.close();
  save('activities',{type:'nota',body:'Cotización PDF generada ('+fmtBs(c.total)+')',deal_id:d.id,contact_id:d.contact_id,author:ME.name,at:nowISO()});
}

/* ---------- Actividad (línea de tiempo + registrar) ---------- */
function activityBlock(ref){
  const list=DB.activities.filter(a=>(ref.deal_id&&a.deal_id===ref.deal_id)||(!ref.deal_id&&ref.contact_id&&a.contact_id===ref.contact_id)||(!ref.deal_id&&!ref.contact_id&&ref.company_id&&a.company_id===ref.company_id)).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const lbl={nota:'Nota',whatsapp:'WhatsApp',llamada:'Llamada',reunion:'Reunión',email:'Correo',etapa:'Cambio'};

function bindActivity(root,ref){

function paintContacts(){

function catalogIssues(){
  const codes=groupBy(DB.products.filter(p=>p.code),p=>p.code.toUpperCase());
  const L=[
    {k:'noprice',n:'Sin precio',f:p=>!(N(p.price_bs)>0)},
    {k:'nocost',n:'Falta tiempo o peso',f:p=>costOf(p).incompleto},
    {k:'nophoto',n:'Sin foto',f:p=>!p.photo_url},
    {k:'neg',n:'Precio bajo el costo',f:p=>{const c=costOf(p);return !c.incompleto&&N(p.price_bs)>0&&c.ganancia<0;}},
    {k:'nocode',n:'Sin código',f:p=>!p.code},
    {k:'dup',n:'Código repetido',f:p=>p.code&&codes[p.code.toUpperCase()].length>1},
    {k:'nocat',n:'Sin categoría',f:p=>!p.category}
  ];
  const act=DB.products.filter(p=>p.active!==false);
  const list=L.map(x=>({...x,c:act.filter(x.f).length})).filter(x=>x.c>0);
  return {list,total:list.length,fn:Object.fromEntries(L.map(x=>[x.k,x.f]))};
}

const jobTag=s=>{const m={cola:'mut',imprimiendo:'acc',hecho:'pos',fallido:'neg'};return `<span class="tag ${m[s]||'mut'}">${(JOB_STATUS.find(x=>x[0]===s)||['',s])[1]}</span>`;};
let prodMonth=nowMonth();
RENDER.produccion=function(){
  const cap=capacityFor(prodMonth),ms=[addMonths(nowMonth(),-3),addMonths(nowMonth(),-2),addMonths(nowMonth(),-1),nowMonth(),addMonths(nowMonth(),1)];
  const cash=cashPosition();
  const hot=cap.pctProj>=S.printer2Threshold;
  let h=`<div class="grid kpis"><div class="card kpi accent"><div class="label">Ocupación ${monthLabel(prodMonth)}</div><div class="val">${fmtPct(cap.pct)}</div><div class="sub">${fmtN(cap.used,1)} h de ${fmtN(cap.cap)} h · plan al ${S.ocupacion}% = ${fmtN(cap.plan)} h</div></div>
    <div class="card kpi"><div class="label">Si se confirman los pedidos</div><div class="val" style="color:${hot?'var(--neg)':'inherit'}">${fmtPct(cap.pctProj)}</div><div class="sub">+${fmtN(cap.pipe,1)} h probables de pedidos abiertos</div></div>
    <div class="card kpi"><div class="label">En cola</div><div class="val">${DB.jobs.filter(j=>j.status==='cola').length}</div><div class="sub">${fmtN(sum(DB.jobs.filter(j=>j.status==='cola'),'hours'),1)} h pendientes</div></div>
    <div class="card kpi"><div class="label">2.ª impresora</div><div class="val" style="font-size:20px">${hot?'Hace falta':'Aún no'}</div><div class="sub">Umbral ${S.printer2Threshold}% · costo ${fmtBs(S.printer2CostBs,0)} · caja ${fmtBs(cash.caja,0)}</div></div></div>`;
  if(hot)h+=`<div class="note neg mt"><b>Disparador de la 2.ª impresora.</b> La proyección de ${monthLabel(prodMonth)} supera el ${S.printer2Threshold}% de capacidad. ${cash.caja>=S.printer2CostBs?'La caja actual alcanza para comprarla.':'Faltan '+fmtBs(S.printer2CostBs-cash.caja,0)+' de caja.'} Registra la compra como gasto “Equipos (CAPEX)” y sube las horas de impresora en Ajustes.</div>`;
  h+=`<div class="cols-2 mt"><div class="card pad"><div class="card-h"><h3>Horas de impresora por mes</h3><span class="desc">Barras = usadas · línea = capacidad planificada</span></div>${barsChart(ms.map(m=>MES[+m.slice(5)-1]),[{name:'Horas',data:ms.map(m=>capacityFor(m).used),color:cssVar('--accent')}],{line:{data:ms.map(()=>S.horasMes*S.ocupacion/100),color:cssVar('--azul')}}).replace(/Bs /g,'')}</div>
    <div class="card pad"><div class="card-h"><h3>Turnos de la impresora</h3></div>${Object.entries(SLOTS).map(([k,v])=>{const js=DB.jobs.filter(j=>j.slot===k&&j.status==='cola');return `<div class="list-row"><div><div class="b small">${v}</div><div class="xs muted">${js.length} trabajos · ${fmtN(sum(js,'hours'),1)} h</div></div></div>`;}).join('')}
    <div class="hint">Capacidad base: 40 h entre semana + 64 h fin de semana desatendido ≈ ${S.horasMes} h/mes.</div></div></div>`;
  h+=`<div class="sec-h"><h3>Cola de impresión</h3><div class="row"><select class="inp" id="prodM" style="min-height:34px;padding:4px 8px">${ms.map(m=>`<option value="${m}" ${m===prodMonth?'selected':''}>${monthLabel(m)}</option>`).join('')}</select><button class="btn sm" id="jnew">＋ Trabajo</button></div></div>
    <div class="kanban" style="grid-auto-columns:minmax(240px,1fr)">${JOB_STATUS.map(([k,n])=>{const js=DB.jobs.filter(j=>j.status===k&&(k==='cola'||k==='imprimiendo'||inMonth(j.date||String(j.done_at||'').slice(0,10),prodMonth))).sort((a,b)=>String(a.date||'9').localeCompare(String(b.date||'9'))||N(a.sort)-N(b.sort));
      return `<div class="kcol" data-js="${k}"><div class="kcol-h"><span class="t">${n}</span><span class="n">${js.length}</span><span class="s">${fmtN(sum(js,'hours'),1)} h</span></div>${js.map(j=>{const f=byId('filaments',j.filament_id),d=byId('deals',j.deal_id);return `<div class="kcard" draggable="true" data-id="${j.id}"><div class="tt">${esc(j.title)}</div><div class="meta">${f?`<span class="div-dot" style="background:${esc(f.hex||'#ccc')};border:1px solid var(--border-strong)"></span>${esc(f.color)}`:''}<span class="amt" style="font-size:13px">${fmtN(j.hours,1)} h</span></div><div class="meta" style="margin-top:4px"><span>${esc((SLOTS[j.slot]||'').split(' (')[0])}</span><span>${j.date?fmtDate(j.date):'sin fecha'}</span>${d?`<span class="spacer"></span><span>#${d.number||''}</span>`:''}</div></div>`;}).join('')}</div>`;}).join('')}</div>`;
  $('#content').innerHTML=h;
  $('#prodM').onchange=e=>{prodMonth=e.target.value;RENDER.produccion();};
  $('#jnew').onclick=()=>openJob();
  $$('.kcard[data-id]').forEach(c=>{c.onclick=()=>openJob(c.dataset.id);c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging');});c.addEventListener('dragend',()=>c.classList.remove('dragging'));});
  $$('.kcol[data-js]').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});col.addEventListener('dragleave',()=>col.classList.remove('over'));col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('over');await setJobStatus(e.dataTransfer.getData('text/plain'),col.dataset.js);});});
};
async function setJobStatus(id,status){
  const j=byId('jobs',id);if(!j||j.status===status)return;
  const row={...j,status};if(status==='hecho'){row.done_at=nowISO();if(!row.date)row.date=todayISO();}
  await save('jobs',row);
  if(status==='hecho'&&j.filament_id&&N(j.grams)>0&&!DB.moves.some(m=>m.job_id===j.id)){const f=byId('filaments',j.filament_id);if(f){await save('moves',{filament_id:f.id,date:todayISO(),delta_g:-N(j.grams),reason:'consumo',job_id:j.id,note:j.title});await save('filaments',{...f,stock_g:N(f.stock_g)-N(j.grams)});toast('Hecho · se descontaron '+fmtN(j.grams)+' g de '+f.color);}}
  else if(status==='fallido'&&j.filament_id&&N(j.grams)>0){const f=byId('filaments',j.filament_id);if(f){await save('moves',{filament_id:f.id,date:todayISO(),delta_g:-N(j.grams),reason:'purga',job_id:j.id,note:'Fallo: '+j.title});await save('filaments',{...f,stock_g:N(f.stock_g)-N(j.grams)});toast('Fallo registrado como merma');}}
  if(j.deal_id){const d=byId('deals',j.deal_id);const js=DB.jobs.filter(x=>x.deal_id===j.deal_id);
    if(d&&status==='imprimiendo'&&d.stage==='pagado')await moveStage(d.id,'produccion',true);
    if(d&&js.length&&js.every(x=>x.status==='hecho'))toast('Todos los trabajos de '+dealName(d)+' están listos para entregar');}
  refreshAll();
}
function openJob(id,preset={}){

  openModal({title:id?'Trabajo de impresión':'Nuevo trabajo de impresión',body:`<div class="form-grid">

    <div class="field"><label>Producto</label><select id="j_p"><option value="">— Libre —</option>${DB.products.filter(p=>p.active!==false||p.id===j.product_id).map(p=>`<option value="${p.id}" ${j.product_id===p.id?'selected':''}>${esc((p.code?p.code+' · ':'')+p.name)}</option>`).join('')}</select></div>

    <div class="field"><label>Horas de máquina (total)</label><input id="j_h" type="number" min="0" step="0.25" value="${N(j.hours)}"></div>
    <div class="field"><label>Filamento (g total)</label><input id="j_g" type="number" min="0" step="1" value="${N(j.grams)}"></div>
    <div class="field"><label>Carrete</label><select id="j_f"><option value="">— Sin descontar —</option>${DB.filaments.filter(f=>f.active!==false).map(f=>`<option value="${f.id}" ${j.filament_id===f.id?'selected':''}>${esc(f.material+' '+f.color)} · ${fmtN(f.stock_g)} g</option>`).join('')}</select></div>
    <div class="field"><label>Turno</label><select id="j_s">${Object.entries(SLOTS).map(([k,v])=>`<option value="${k}" ${j.slot===k?'selected':''}>${v}</option>`).join('')}</select></div>

RENDER.inventario=function(){

  const since=addDays(todayISO(),-30),cons=-sum(DB.moves.filter(m=>m.date>=since&&N(m.delta_g)<0),'delta_g');
  let h=`<div class="grid kpis"><div class="card kpi accent"><div class="label">Stock total</div><div class="val">${fmtN(total/1000,2)} kg</div><div class="sub">${fs.length} carretes activos</div></div>
    <div class="card kpi"><div class="label">Valor del stock</div><div class="val">${fmtBs(valor,0)}</div><div class="sub">a costo de compra</div></div>
    <div class="card kpi"><div class="label">Consumo 30 días</div><div class="val">${fmtN(cons/1000,2)} kg</div><div class="sub">${cons>0?'alcanza ~'+fmtN(total/(cons/30))+' días':'sin consumo registrado'}</div></div>
    <div class="card kpi"><div class="label">Bajo mínimo</div><div class="val" style="color:${low.length?'var(--neg)':'inherit'}">${low.length}</div><div class="sub">${low.map(f=>esc(f.color)).join(', ')||'todo en orden'}</div></div></div>
    <div class="sec-h"><h3>Carretes</h3><div class="row"><button class="btn sm ghost" id="fBuy">Registrar compra</button><button class="btn sm" id="fNew">＋ Carrete</button></div></div>
    ${fs.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${fs.map(f=>{const pct=Math.min(100,N(f.stock_g)/Math.max(1000,N(f.min_g)*4)*100);const lowf=N(f.stock_g)<N(f.min_g);return `<div class="card pad" style="cursor:pointer" data-f="${f.id}"><div class="row"><span style="width:34px;height:34px;border-radius:50%;background:${esc(f.hex||'#ccc')};border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);flex:0 0 auto"></span><div style="min-width:0"><div class="b ell">${esc(f.color)}</div><div class="xs muted">${esc(f.material)}${f.brand?' · '+esc(f.brand):''}</div></div>${lowf?'<span class="tag neg" style="margin-left:auto">Bajo</span>':''}</div>
      <div class="row between mt"><span style="font-family:var(--font-display);font-size:24px;font-weight:800">${fmtN(f.stock_g)} g</span><span class="xs muted">mín ${fmtN(f.min_g)} g</span></div><div class="progress" style="margin-top:6px"><i style="width:${pct}%;background:${lowf?'var(--neg)':esc(f.hex||'var(--accent)')}"></i></div></div>`;}).join('')}</div>`:`<div class="card">${emptyBox('spool','Sin carretes','Carga cada color de filamento que tienes para que la producción lo descuente sola.')}</div>`}
    <div class="sec-h"><h3>Movimientos recientes</h3></div>
    <div class="card">${DB.moves.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Carrete</th><th>Motivo</th><th>Nota</th><th class="r">Gramos</th></tr></thead><tbody>${DB.moves.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.created_at).localeCompare(String(a.created_at))).slice(0,30).map(m=>{const f=byId('filaments',m.filament_id);return `<tr><td class="small">${fmtDate(m.date)}</td><td>${f?esc(f.material+' '+f.color):'—'}</td><td><span class="tag ${N(m.delta_g)>0?'pos':m.reason==='purga'?'neg':'mut'}">${esc(m.reason)}</span></td><td class="small muted">${esc(m.note||'')}</td><td class="r b ${N(m.delta_g)>0?'pos-t':''}">${N(m.delta_g)>0?'+':''}${fmtN(m.delta_g)}</td></tr>`;}).join('')}</tbody></table></div>`:emptyBox('spool','Sin movimientos','')}</div>`;
  $('#content').innerHTML=h;

RENDER.resultados=function(){
  const ms=lastMonths(12),fs=ms.map(monthFin),mk=nowMonth(),f=monthFin(mk),ac=avgContribution();
  const fixedRef=f.fijos||sum(DB.recurring.filter(r=>r.active&&!VARIABLE_CATS.includes(r.category)&&!CAPEX_CATS.includes(r.category)),'amount_bs');
  const beU=ac.v>0?Math.ceil(fixedRef/ac.v):0;
  const units=sum(DB.deals.filter(d=>['pagado','produccion','entregado'].includes(d.stage)&&inMonth(d.closed_at||d.stage_changed_at,mk)),d=>dealCalc(d).units);
  const y=ms.filter(m=>m.slice(0,4)===mk.slice(0,4)).map(monthFin);
  let h=`<div class="grid kpis"><div class="card kpi accent"><div class="label">Punto de equilibrio</div><div class="val">${beU} uds/mes</div><div class="sub">${fmtBs(fixedRef,0)} fijos ÷ ${fmtBs(ac.v)} de contribución media</div></div>
    <div class="card kpi"><div class="label">Unidades vendidas este mes</div><div class="val">${fmtN(units)}</div><div class="sub">${beU?(units>=beU?'Equilibrio superado ✔':'Faltan '+(beU-units)+' uds'):'—'}</div>${beU?`<div class="progress" style="margin-top:8px"><i style="width:${Math.min(100,units/beU*100)}%;background:${units>=beU?'var(--pos)':'var(--accent)'}"></i></div>`:''}</div>
    <div class="card kpi"><div class="label">Cobrado en el año</div><div class="val">${fmtBs(sum(y,'ingresos'),0)}</div><div class="sub">${fmtUSD(sum(y,'ingresos')/S.usdRate)}</div></div>
    <div class="card kpi"><div class="label">Utilidad en el año</div><div class="val" style="color:${sum(y,'utilidad')>=0?'var(--pos)':'var(--neg)'}">${fmtBs(sum(y,'utilidad'),0)}</div><div class="sub">${sum(y,'ingresos')?fmtPct(sum(y,'utilidad')/sum(y,'ingresos')*100)+' de margen':''}</div></div></div>
    <div class="note info mt small">La contribución media sale de ${ac.src}. Los gastos <b>variables</b> (filamento, empaque, electricidad, colaboradoras) no entran al punto de equilibrio porque ya están en el costo unitario: así no se cuentan dos veces.</div>
    <div class="card pad mt"><div class="card-h"><h3>Cobrado por división · 12 meses</h3><div class="legend" style="margin:0">${DIVS.map(d=>`<div class="li"><span class="sw" style="background:${DIV[d].hex}"></span>${DIV[d].s}</div>`).join('')}<div class="li"><span class="sw" style="background:${cssVar('--text')}"></span>Utilidad</div></div></div>
    ${barsChart(ms.map(m=>MES[+m.slice(5)-1]),DIVS.map(d=>({name:DIV[d].s,data:fs.map(x=>x.byDiv[d]),color:DIV[d].hex})),{line:{data:fs.map(x=>x.utilidad),color:cssVar('--text')}})}</div>
    <div class="sec-h"><h3>Estado de resultados (base caja)</h3><button class="btn sm ghost" id="plCsv">Exportar CSV</button></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Concepto</th>${ms.map(m=>`<th class="r">${monthLabel(m)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>`;
  const row=(l,fn,b,cls='')=>`<tr><td class="${b?'b':''} nowrap">${l}</td>${fs.map(x=>`<td class="r ${b?'b':''} ${cls}">${fmtN(fn(x))}</td>`).join('')}<td class="r b">${fmtN(sum(fs,fn))}</td></tr>`;
  h+=row('Cobrado',x=>x.ingresos,true);DIVS.forEach(d=>h+=row('&nbsp;&nbsp;'+DIV[d].s,x=>x.byDiv[d],false,'muted'));h+=row('&nbsp;&nbsp;Sin pedido',x=>x.byDiv.none,false,'muted');
  h+=row('Gastos variables',x=>-x.variables);h+=row('Margen de contribución',x=>x.ingresos-x.variables,true);h+=row('Gastos fijos',x=>-x.fijos);
  h+=row('Utilidad operativa',x=>x.ingresos-x.variables-x.fijos,true);h+=row('Inversión (CAPEX)',x=>-x.capex);
  h+=`<tr><td class="b">Flujo neto</td>${fs.map(x=>`<td class="r b ${x.utilidad>=0?'pos-t':'neg-t'}">${fmtN(x.utilidad)}</td>`).join('')}<td class="r b">${fmtN(sum(fs,'utilidad'))}</td></tr></tbody></table></div></div>`;
  // Rentabilidad por producto vendido
  const its=[];DB.deals.filter(d=>['pagado','produccion','entregado'].includes(d.stage)).forEach(d=>itemsOf(d.id).forEach(i=>its.push(i)));
  const bp=Object.entries(groupBy(its,i=>i.product_id||'libre')).map(([k,v])=>{const p=byId('products',k);const rev=sum(v,i=>N(i.qty)*N(i.unit_price_bs)),cost=sum(v,i=>N(i.qty)*N(i.unit_cost_bs)),hrs=sum(v,i=>N(i.qty)*N(i.unit_hours));return {n:p?p.name:'Líneas libres',d:p?p.division:null,u:sum(v,'qty'),rev,mar:rev-cost,bsh:hrs?rev/hrs:0};}).sort((a,b)=>b.mar-a.mar);
  h+=`<div class="sec-h"><h3>Rentabilidad por producto vendido</h3><span class="desc">Pedidos confirmados, histórico</span></div><div class="card">${bp.length?`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>División</th><th class="r">Uds</th><th class="r">Vendido</th><th class="r">Margen</th><th class="r">Bs/h</th></tr></thead><tbody>${bp.slice(0,15).map(x=>`<tr><td><b>${esc(x.n)}</b></td><td>${divTag(x.d)}</td><td class="r">${fmtN(x.u)}</td><td class="r">${fmtBs(x.rev,0)}</td><td class="r b">${fmtBs(x.mar,0)}</td><td class="r">${x.bsh?fmtN(x.bsh,0):'—'}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('chart','Aún sin ventas confirmadas','')}</div>`;
  $('#content').innerHTML=h;
  $('#plCsv').onclick=()=>exportCSV('resultados_'+todayISO(),['Mes','Cobrado',...DIVS.map(d=>DIV[d].s),'Sin pedido','Variables','Fijos','CAPEX','Flujo neto'],ms.map((m,i)=>{const x=fs[i];return [m,x.ingresos,...DIVS.map(d=>x.byDiv[d]),x.byDiv.none,x.variables,x.fijos,x.capex,x.utilidad];}));
};

function taskRow(t){const late=t.status!=='hecha'&&t.due&&t.due<todayISO();const d=byId('deals',t.deal_id);
  return `<div class="task-row ${t.status==='hecha'?'done':''}"><button class="ck" data-tdone="${t.id}" aria-label="Marcar hecha">${t.status==='hecha'?'✓':''}</button><div style="flex:1;min-width:0"><div class="tt" data-topen="${t.id}">${esc(t.title)}</div>
    <div class="xs muted row wrap" style="gap:6px;margin-top:2px">${t.due?`<span class="${late?'neg-t b':''}">${late?'⚠ ':''}${fmtDate(t.due)} · ${relDay(t.due)}</span>`:''}${t.priority==='alta'?'<span class="tag neg">Alta</span>':''}${t.status==='en_curso'?'<span class="tag info">En curso</span>':''}${d?`<span>· ${esc(dealName(d))}</span>`:''}${t.pod?`<span>· ${POD[t.pod].split(' ')[1]}</span>`:''}</div></div>${avatar(t.assignee_id,true)}</div>`;}
function bindTaskRows(root){
  $$('[data-tdone]',root).forEach(b=>b.onclick=async e=>{e.stopPropagation();const t=byId('tasks',b.dataset.tdone);const done=t.status!=='hecha';await save('tasks',{...t,status:done?'hecha':'pendiente',done_at:done?nowISO():null});toast(done?'Tarea hecha ✓':'Tarea reabierta');refreshAll();});
  $$('[data-topen]',root).forEach(b=>b.onclick=()=>openTask(b.dataset.topen));
}
let taskF={who:'',pod:'',show:'abiertas'};
RENDER.tareas=function(){
  const today=todayISO(),wk=addDays(today,7);
  let ts=DB.tasks.filter(t=>(!taskF.who||t.assignee_id===taskF.who)&&(!taskF.pod||t.pod===taskF.pod)&&(taskF.show==='todas'||t.status!=='hecha'));
  const groups=[['Vencidas',t=>t.status!=='hecha'&&t.due&&t.due<today],['Hoy',t=>t.status!=='hecha'&&t.due===today],['Esta semana',t=>t.status!=='hecha'&&t.due>today&&t.due<=wk],['Más adelante',t=>t.status!=='hecha'&&t.due>wk],['Sin fecha',t=>t.status!=='hecha'&&!t.due],['Hechas',t=>t.status==='hecha']];
  const load=DB.team.filter(m=>m.active!==false).map(m=>({m,n:DB.tasks.filter(t=>t.assignee_id===m.id&&t.status!=='hecha').length,late:DB.tasks.filter(t=>t.assignee_id===m.id&&t.status!=='hecha'&&t.due&&t.due<today).length}));
  $('#content').innerHTML=`<div class="grid kpis">${load.map(x=>`<div class="card kpi" style="cursor:pointer" data-who="${x.m.id}"><div class="row"><span class="avatar ${x.m.pod==='tecnico'?'lab':'navy'}">${esc(initials(x.m.name))}</span><div><div class="b">${esc(x.m.name)}</div><div class="xs muted">${x.m.pod?POD[x.m.pod]:ROLES[x.m.role]}</div></div></div><div class="row" style="margin-top:10px;gap:8px"><span class="val" style="font-size:22px;margin:0">${x.n}</span><span class="small muted">abiertas</span>${x.late?`<span class="tag neg">${x.late} vencidas</span>`:''}</div></div>`).join('')}</div>
    <div class="toolbar mt"><select class="inp" id="tw">${memberOpts(taskF.who,'Todo el equipo')}</select><select class="inp" id="tp"><option value="">Todas las áreas</option>${Object.entries(POD).map(([k,v])=>`<option value="${k}" ${taskF.pod===k?'selected':''}>${v}</option>`).join('')}</select>
    <div class="seg"><button data-s="abiertas" class="${taskF.show==='abiertas'?'on':''}">Abiertas</button><button data-s="todas" class="${taskF.show==='todas'?'on':''}">Incluir hechas</button></div><span class="spacer"></span><button class="btn sm" id="tnew">＋ Tarea</button></div>
    <div class="cols-2e">${groups.map(([n,f])=>{const l=ts.filter(f).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||''))||(a.priority==='alta'?-1:1));if(!l.length)return '';return `<div class="card pad"><div class="card-h"><h3 class="${n==='Vencidas'?'neg-t':''}">${n}</h3><span class="desc">${l.length}</span></div>${l.slice(0,n==='Hechas'?15:100).map(taskRow).join('')}</div>`;}).join('')||`<div class="card">${emptyBox('check','Nada pendiente','')}</div>`}</div>`;
  $('#tw').onchange=e=>{taskF.who=e.target.value;RENDER.tareas();};$('#tp').onchange=e=>{taskF.pod=e.target.value;RENDER.tareas();};
  $$('[data-s]').forEach(b=>b.onclick=()=>{taskF.show=b.dataset.s;RENDER.tareas();});$$('[data-who]').forEach(b=>b.onclick=()=>{taskF.who=taskF.who===b.dataset.who?'':b.dataset.who;RENDER.tareas();});
  $('#tnew').onclick=()=>openTask();bindTaskRows($('#content'));
};
function openTask(id,preset={}){

    <div class="field"><label>Pedido</label><select id="t_deal"><option value="">—</option>${DB.deals.filter(d=>OPEN_STAGES.includes(d.stage)||d.id===t.deal_id).map(d=>`<option value="${d.id}" ${t.deal_id===d.id?'selected':''}>${esc(dealName(d))}</option>`).join('')}</select></div>
    <div class="full field"><label>Notas</label><textarea id="t_n">${esc(t.notes||'')}</textarea></div></div>`,
    footLeft:id?'<button class="btn sm danger" id="t_del">Eliminar</button>':'',
    onSave:async()=>{if(!val('t_t')){toast('Escribe la tarea','err');return;}const st=val('t_s');const a=val('t_a');const m=byId('team',a);

    if(calShow.ev)DB.events.filter(e=>iso>=e.date&&iso<=(e.end_date||e.date)).forEach(e=>out.push(`<button class="ev ${e.type}" data-ev="${e.id}" title="${esc(e.name)}">${esc(e.name)}</button>`));

  $('#content').innerHTML=`<div class="toolbar"><button class="btn sm ghost" id="calPrev">‹</button><h3 style="font-family:var(--font-display);font-size:20px;font-weight:800;min-width:170px;text-align:center;text-transform:capitalize">${monthLong(calMonth)}</h3><button class="btn sm ghost" id="calNext">›</button><button class="btn sm quiet" id="calToday">Hoy</button>
    <span class="spacer"></span>${[['ev','Fechas'],['content','Contenido'],['task','Tareas'],['deal','Entregas']].map(([k,n])=>`<button class="chip ${calShow[k]?'on':''}" data-sh="${k}">${n}</button>`).join('')}<button class="btn sm ghost" id="evNew">＋ Fecha</button><button class="btn sm" id="ctNew">＋ Contenido</button></div>
    <div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.map(iso=>`<div class="day ${iso.slice(0,7)!==calMonth?'out':''} ${iso===today?'today':''}" data-day="${iso}"><span class="dn">${+iso.slice(8)}</span>${itemsOn(iso)}</div>`).join('')}</div>
    <div class="sec-h"><h3>Pipeline de contenido</h3><span class="desc">TikTok descubre → Instagram da confianza → WhatsApp cierra</span></div><div class="kanban">${pipe}</div>`;
  $('#calPrev').onclick=()=>{calMonth=addMonths(calMonth,-1);RENDER.calendario();};$('#calNext').onclick=()=>{calMonth=addMonths(calMonth,1);RENDER.calendario();};$('#calToday').onclick=()=>{calMonth=nowMonth();RENDER.calendario();};
  $$('[data-sh]').forEach(b=>b.onclick=()=>{calShow[b.dataset.sh]=calShow[b.dataset.sh]?0:1;lsSet('kc_calShow',calShow);RENDER.calendario();});
  $('#evNew').onclick=()=>openEvent();$('#ctNew').onclick=()=>openContent();
  $$('[data-ev]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEvent(b.dataset.ev);});$$('[data-ct]').forEach(b=>b.onclick=e=>{e.stopPropagation();openContent(b.dataset.ct);});
  $$('[data-tk]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTask(b.dataset.tk);});$$('[data-dl]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDeal(b.dataset.dl);});
  $$('[data-day]').forEach(c=>c.ondblclick=()=>openContent(null,{date:c.dataset.day}));
  $$('.kcard[data-cid]').forEach(c=>{c.onclick=()=>openContent(c.dataset.cid);c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.cid);});});
  $$('.kcol[data-cs]').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});col.addEventListener('dragleave',()=>col.classList.remove('over'));col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('over');const c=byId('content',e.dataTransfer.getData('text/plain'));if(c&&c.status!==col.dataset.cs){await save('content',{...c,status:col.dataset.cs});refreshAll();}});});
};

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function parseNum(s){if(s==null)return null;s=String(s).trim();if(!s||/div\/0|#n\/a|#value/i.test(s))return null;s=s.replace(/[^\d,.\-]/g,'');if(!s)return null;
  if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?n:null;}
function parseHours(s){s=String(s||'').toLowerCase().trim();if(!s)return null;let m=s.match(/(\d+(?:[.,]\d+)?)\s*h/);let mm=s.match(/(\d+)\s*m/);if(m||mm)return (m?parseNum(m[1]):0)+(mm?parseNum(mm[1])/60:0);m=s.match(/^(\d+):(\d{1,2})/);if(m)return +m[1]+ +m[2]/60;if(/min/.test(s))return (parseNum(s)||0)/60;return parseNum(s);}
const CSV_MAP=[['code',['codigo','cod','sku']],['name',['producto','nombre','product']],['variant',['variante','tamano','escala']],['category',['categoria']],['description',['descripcion']],['tags',['etiquetas','tags']],['size_mm',['medidas','medidas (mm)','dimensiones']],['pieces',['piezas']],['print_time_h',['tiempo de impresion','tiempo impresion','impresion (h)','tiempo de impresion (h)','horas']],['weight_g',['peso','peso (g)','gramos']],['diseno_h',['tiempo de diseno','diseno (h)']],['price_bs',['precio de venta','precio venta','precio','pvp','precio de venta (bs)']],['price_wholesale_bs',['precio mayorista','mayorista']],['model_source',['modelo','modelo (maker/propio)','fuente']],['drive_url',['carpeta drive','drive','carpeta']],['division',['division']]];
function previewCSV(text,fname){
  const rows=parseCSV(text);if(rows.length<2){toast('El CSV está vacío','err');return;}
  let hi=rows.findIndex(r=>r.some(c=>['codigo','producto'].includes(norm(c))));if(hi<0)hi=0;
  const H=rows[hi].map(norm);const idx={};CSV_MAP.forEach(([k,al])=>{const i=H.findIndex(h=>al.includes(h));if(i>=0&&idx[k]==null)idx[k]=i;});
  const colorIdx=H.map((h,i)=>/^color/.test(h)?i:-1).filter(i=>i>=0);
  if(idx.name==null){toast('No encontré la columna “Producto”','err');return;}
  const guessDiv=/tech|tch/i.test(fname)?'tech':/code|soft/i.test(fname)?'code':'design';
  const parsed=rows.slice(hi+1).map(r=>{const g=k=>idx[k]!=null?String(r[idx[k]]||'').trim():'';if(!g('name'))return null;
    const code=g('code').toUpperCase()||null;const dv=norm(g('division'));
    return {code,name:g('name'),variant:g('variant')||null,category:g('category')||null,description:g('description')||null,tags:g('tags')?g('tags').split(/[,;]/).map(s=>s.trim()).filter(Boolean):null,size_mm:g('size_mm')||null,pieces:parseNum(g('pieces')),print_time_h:parseHours(g('print_time_h')),weight_g:parseNum(g('weight_g')),diseno_h:parseHours(g('diseno_h')),price_bs:parseNum(g('price_bs')),price_wholesale_bs:parseNum(g('price_wholesale_bs')),model_source:g('model_source')||null,drive_url:g('drive_url')||null,
      colors:colorIdx.map(i=>String(r[i]||'').trim()).filter(c=>c&&!/^(no|false|-|0)$/i.test(c)),divHint:dv.includes('work')||dv.includes('lab')||dv.includes('tech')?'tech':dv.includes('code')||dv.includes('soft')?'code':dv.includes('design')?'design':code&&code.startsWith('DS')?'design':code&&code.startsWith('TCH')?null:null};}).filter(Boolean);
  const upd=parsed.filter(p=>p.code&&DB.products.some(x=>String(x.code||'').toUpperCase()===p.code)).length;
  const dup=Object.entries(groupBy(parsed.filter(p=>p.code),p=>p.code)).filter(([k,v])=>v.length>1).map(([k])=>k);
  openModal({title:'Importar '+fname,wide:true,saveLabel:'Importar '+parsed.length+' productos',body:`<div class="row wrap mb" style="gap:8px"><span class="tag pos">${parsed.length-upd} nuevos</span><span class="tag info">${upd} se actualizan</span>${parsed.filter(p=>!p.code).length?`<span class="tag warn">${parsed.filter(p=>!p.code).length} sin código</span>`:''}${dup.length?`<span class="tag neg">Duplicados en el archivo: ${esc(dup.join(', '))} (se usa la última fila)</span>`:''}</div>
    <div class="form-grid"><input type="hidden" id="imDiv" value="tech"><div class="field"><label>División si no hay código</label><select id="imDiv2">${divOpts(guessDiv)}</select></div></div>
    <div class="note info small mb">Columnas detectadas: ${Object.keys(idx).map(k=>'<b>'+k+'</b>').join(', ')}${colorIdx.length?', '+colorIdx.length+' de color':''}. Las celdas vacías no borran lo que ya tengas. Los precios se toman en <b>Bs</b> aunque el Sheet diga “$”.</div>
    <div class="tbl-wrap" style="max-height:44vh"><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Peso</th><th class="r">Horas</th><th class="r">Precio Bs</th></tr></thead><tbody>${parsed.slice(0,60).map(p=>`<tr><td>${p.code?`<span class="code">${esc(p.code)}</span>`:'—'}</td><td>${esc(p.name)}${p.variant?' · '+esc(p.variant):''}<div class="sub">${esc(p.category||'')}</div></td><td class="r">${p.weight_g!=null?fmtN(p.weight_g):'—'}</td><td class="r">${p.print_time_h!=null?fmtN(p.print_time_h,2):'—'}</td><td class="r">${p.price_bs!=null?fmtN(p.price_bs,2):'<span class="warn-t">—</span>'}</td></tr>`).join('')}</tbody></table></div>`,
    onSave:async()=>{const tchDiv=val('imDiv'),noDiv=val('imDiv2');const rowsOut=[];const seen={};
      parsed.forEach(p=>{const ex=p.code?(seen[p.code]||DB.products.find(x=>String(x.code||'').toUpperCase()===p.code)):DB.products.find(x=>!x.code&&norm(x.name)===norm(p.name)&&norm(x.variant)===norm(p.variant));
        const division=p.divHint||(p.code&&p.code.startsWith('TCH')?tchDiv:p.code&&p.code.startsWith('CD')?'code':p.code&&p.code.startsWith('DS')?'design':noDiv);
        const patch={};Object.entries(p).forEach(([k,v])=>{if(k==='divHint')return;if(v==null||(Array.isArray(v)&&!v.length))return;patch[k]=v;});
        const row=ex?{...ex,...patch,division:ex.division||division}:{id:uuid(),active:true,purge_pct:0,insumos_bs:0,empaque_bs:0,mano_obra_bs:0,merma_pct:0,fase:'Arranque',...patch,division};
        if(p.code)seen[p.code]=row;const i=rowsOut.findIndex(r=>r.id===row.id);if(i>=0)rowsOut[i]=row;else rowsOut.push(row);});
      await saveMany('products',rowsOut);closeModal();toast(rowsOut.length+' productos importados');catF={q:'',div:'',cat:'',flag:''};go('catalogo');}});
}

async function migrateV1(st,extraImages){
  if(!st||!st.products){toast('No reconozco el formato v1','err');return;}
  const RUB={R1:['tech','Kits científicos'],R2:['design','Regalos'],R3:['design','Coleccionables'],R4:['design','Hogar'],R5:['tech','Colegios STEM'],R6:['tech','Prototipos'],R7:['tech','Merchandising']};
  const imgs={...(st.images||{}),...(extraImages||{})};
  if(!(await confirmDlg(`Se importarán <b>${st.products.length}</b> productos, <b>${(st.sales||[]).length}</b> ventas, <b>${(st.expenses||[]).length}</b> gastos, <b>${(st.partners||[]).length}</b> socios y <b>${(st.dividends||[]).length}</b> repartos.<br><br>Las ventas “Pagado” y “Entregado” entran como cobradas (así las contaba la v1); las “Pedido” quedan en producción sin cobro.`,'Migrar')))return;
  const paidDelivered=true;
  toast('Migrando… no cierres la pestaña');setSync('saving','Migrando…');
  const pmap={},prods=[];
  for(const p of st.products){const ex=DB.products.find(x=>norm(x.name)===norm(p.name));if(ex){pmap[p.id]=ex.id;continue;}
    const r=RUB[p.rubro]||['design',''];const id=uuid();pmap[p.id]=id;let photo=null;
    if(p.hasPhoto&&imgs[p.id]){try{const blob=await (await fetch(imgs[p.id])).blob();photo=await Store().upload(blob,id+'.jpg');}catch(e){console.warn('foto',e);}}
    prods.push({id,code:null,division:r[0],category:r[1],name:p.name,fase:p.fase,score:p.score,weight_g:N(p.weightG),print_time_h:N(p.printTimeH),filament_rate:p.filamentRate,purge_pct:0,insumos_bs:N(p.insumosBs),empaque_bs:N(p.empaqueBs),diseno_h:N(p.disenoH),mano_obra_bs:N(p.manoObraBs),merma_pct:N(p.mermaPct),price_bs:N(p.priceBs),notes:[p.notes,'Migrado de v1 ('+p.rubro+')'].filter(Boolean).join(' · '),photo_url:photo,active:true,tags:[],colors:[]});}
  if(prods.length)await saveMany('products',prods);
  const cmap={},contacts=[],deals=[],items=[],pays=[];
  for(const s of (st.sales||[])){
    let cid=null;const cn=String(s.cliente||'').trim();if(cn){const k=norm(cn);const ex=DB.contacts.find(c=>norm(c.name)===k)||contacts.find(c=>norm(c.name)===k);if(ex)cid=ex.id;else{cid=uuid();contacts.push({id:cid,name:cn,lifecycle:'cliente',source:s.canal||null,created_at:s.fecha+'T12:00:00Z',tags:[]});}}
    const pid=pmap[s.productId]||null,p=pid?(prods.find(x=>x.id===pid)||byId('products',pid)):null;
    const stage=s.estado==='Pedido'?'produccion':'entregado';const did=uuid();const ts=(s.fecha||todayISO())+'T12:00:00Z';
    deals.push({id:did,title:(s.productName||'Venta')+(cn?' · '+cn:''),contact_id:cid,division:p?p.division:'design',stage,source:s.canal||null,discount_bs:0,shipping_bs:0,stage_changed_at:ts,closed_at:ts,delivery_date:stage==='entregado'?s.fecha:null,created_at:ts,collaborators:[],notes:s.nota||'Migrado de v1'});
    items.push({id:uuid(),deal_id:did,product_id:pid,qty:N(s.unidades)||1,unit_price_bs:N(s.precioUnit),unit_cost_bs:p?+costOf(p).total.toFixed(2):0,unit_hours:p?N(p.print_time_h):0,unit_grams:p?N(p.weight_g):0,sort:0,created_at:ts});
    if(s.estado==='Pagado'||(paidDelivered&&s.estado==='Entregado'))pays.push({id:uuid(),deal_id:did,date:s.fecha,amount_bs:N(s.total)||N(s.unidades)*N(s.precioUnit),method:null,kind:'pago',note:'Migrado de v1',created_at:ts});
  }
  if(contacts.length)await saveMany('contacts',contacts);if(deals.length)await saveMany('deals',deals);if(items.length)await saveMany('items',items);if(pays.length)await saveMany('payments',pays);

function showReset(tok){
  $('#scrSetup').classList.remove('hidden');const card=$('#setupCard');
  card.innerHTML=KD_HEAD+`<div class="sub">Crea tu contraseña nueva</div><div class="field"><label for="rp1">Contraseña nueva (mínimo 8)</label><input id="rp1" type="password" autocomplete="new-password"></div><div class="field"><label for="rp2">Repítela</label><input id="rp2" type="password" autocomplete="new-password"></div><div class="err" id="rpErr"></div><div class="row mt"><span class="spacer"></span><button class="btn" id="rpGo">Guardar contraseña</button></div>`;
  $('#rpGo').onclick=async()=>{const a=$('#rp1').value,b=$('#rp2').value;if(a.length<8){$('#rpErr').textContent='Mínimo 8 caracteres.';return;}if(a!==b){$('#rpErr').textContent='No coinciden.';return;}
    try{await api('reset',{token:tok,password:a});card.innerHTML=KD_HEAD+`<div class="sub">Listo. Ya puedes ingresar con tu contraseña nueva.</div><div class="row mt"><span class="spacer"></span><a class="btn" href="${location.pathname}">Ir a ingresar</a></div>`;}catch(e){$('#rpErr').textContent=e.message;}};
}
function showLogin(){
  $('#scrLogin').classList.remove('hidden');
  $('#loginBtn').onclick=doLogin;$('#pw').onkeydown=e=>{if(e.key==='Enter')doLogin();};$('#email').onkeydown=e=>{if(e.key==='Enter')$('#pw').focus();};
  $('#forgotBtn').onclick=async()=>{const email=val('email');$('#loginOk').textContent='';if(!email){$('#loginErr').textContent='Escribe tu correo y vuelve a tocar el enlace.';return;}try{await api('reset_request',{email});$('#loginErr').textContent='';$('#loginOk').textContent='Si el correo está registrado, te llegó un enlace para cambiar la contraseña (revisa spam).';}catch(e){$('#loginErr').textContent=e.message;}};
  setTimeout(()=>$('#email').focus(),50);
}
async function doLogin(){
  const email=val('email'),password=$('#pw').value;$('#loginErr').textContent='';$('#loginOk').textContent='';
  if(!email||!password){$('#loginErr').textContent='Ingresa correo y contraseña.';return;}
  $('#loginBtn').textContent='Ingresando…';let j;try{j=await api('login',{email,password});}catch(e){$('#loginBtn').textContent='Ingresar';$('#loginErr').textContent=e.message;$('#pw').select();return;}$('#loginBtn').textContent='Ingresar';
  ME.email=j.email;await enterCloud();
}
async function enterCloud(){
  MODE='cloud';
  try{await Cloud.loadAll();}
  catch(e){console.error(e);$('#scrLogin').classList.remove('hidden');$('#loginErr').textContent=e.status===403?e.message:'No se pudieron cargar los datos: '+e.message;if(e.status===403){try{await api('logout',{});}catch(_){}}return;}
  $('#scrLogin').classList.add('hidden');
  if(!S.onboarded&&!DB.products.length&&!DB.deals.length)return showSetup('first');
  startApp();
}
const KD_HEAD=`<div class="kd-logo lg"><span class="kd-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="36 44 280 336"><polygon fill="#F96B0E" points="94,68 222,49 230,112 100,118"/><polygon fill="#FDB384" points="42,120 174,106 181,248 52,256"/><polygon fill="#C75000" points="172,104 304,91 310,233 181,239"/><polygon fill="currentColor" points="99,203 116,192 158,261 170,264 232,184 248,196 176,290 178,316 166,332 179,345 184,376 139,376 144,345 157,332 146,316 146,288"/></svg></span><span class="kd-bar"></span><span class="kd-txt"><span class="kd-k">KASTOR</span><span class="kd-n">Directory</span></span></div>`;
async function showSetup(kind,msg){
  $('#scrSetup').classList.remove('hidden');const card=$('#setupCard');const head=KD_HEAD;
  if(kind==='install'){card.innerHTML=head+`<div class="sub">Falta instalar la base de datos.</div><div class="note small">1. Revisa que <b>config.php</b> tenga los datos de tu base MySQL (hPanel → Bases de datos).<br>2. Abre <b>install.php</b> en esta misma carpeta, pon tu correo y contraseña de usuario maestro.<br>3. Vuelve aquí y recarga.</div><div class="row mt"><span class="spacer"></span><a class="btn ghost" href="install.php">Abrir install.php</a><button class="btn" onclick="location.reload()">Recargar</button></div>`;return;}
  const legacy=null;
  card.innerHTML=head+`<div class="sub">Primera vez en KDirectory. ¿Cómo quieres empezar?</div>
    ${legacy?`<button class="list-row" style="width:100%;text-align:left;cursor:pointer" id="suMig"><div><div class="b">Migrar la versión anterior <span class="tag acc">recomendado</span></div><div class="small muted">${legacy.products.length} productos, ${(legacy.sales||[]).length} ventas y ${(legacy.expenses||[]).length} gastos encontrados en Supabase. Se suma el calendario comercial y el equipo.</div></div></button>`:''}
    <button class="list-row" style="width:100%;text-align:left;cursor:pointer" id="suBase"><div><div class="b">Empezar con la base de KASTOR</div><div class="small muted">Equipo, muestra del Catálogo Maestro (DS/TCH), calendario comercial de Santa Cruz y próximos pasos.</div></div></button>
    <button class="list-row" style="width:100%;text-align:left;cursor:pointer" id="suEmpty"><div><div class="b">Empezar vacío</div><div class="small muted">Cargas todo tú; el Catálogo Maestro se puede importar desde CSV.</div></div></button><div class="err" id="suErr"></div>`;
  const base=async(withCatalog)=>{const keep=Object.fromEntries(Object.keys(T).map(k=>[k,DB[k]]));seedBase();const rows={team:mergeTeam(DB.team,keep.team),events:DB.events,products:withCatalog?DB.products:[],recurring:[]};Object.keys(T).forEach(k=>DB[k]=keep[k]);
    for(const k of ['team','events','products','recurring'])if(rows[k].length)await saveMany(k,rows[k]);await saveMany('tasks',seedTasks());await setSettings({onboarded:true});};
  const mergeTeam=(seed,cur)=>seed.map(s=>{const first=norm(s.name).split(' ')[0];const ex=cur.find(x=>norm(x.name).split(' ')[0]===first);return ex?{...s,...ex,title:ex.title||s.title,access:ex.access||s.access,notes:ex.notes||s.notes}:s;}).concat(cur.filter(x=>!seed.some(s=>norm(s.name).split(' ')[0]===norm(x.name).split(' ')[0])));
  const run=async(fn)=>{$$('#setupCard button').forEach(b=>b.disabled=true);try{await fn();$('#scrSetup').classList.add('hidden');startApp();}catch(e){$('#suErr').textContent='Error: '+(e.message||e);$$('#setupCard button').forEach(b=>b.disabled=false);}};
  const m=$('#suMig');if(m)m.onclick=()=>run(async()=>{await base(false);$('#scrSetup').classList.add('hidden');startApp();await migrateV1(legacy);});
  $('#suBase').onclick=()=>run(()=>base(true));
  $('#suEmpty').onclick=()=>run(async()=>{await saveMany('team',mergeTeam(seedTeam(),DB.team));await setSettings({onboarded:true});});
}
async function startDemo(){MODE='demo';ME.email='';$('#scrLogin').classList.add('hidden');await Demo.loadAll();startApp();}
let started=false;
async function startApp(){
  if(started){refreshAll();return;}started=true;
  $('#app').classList.remove('hidden');$('#demoBanner').classList.toggle('hidden',MODE!=='demo');setMe();setSync('synced');
  $('#burger').onclick=()=>document.body.classList.toggle('nav-open');$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
  $('#searchBtn').onclick=openPalette;$('#bellBtn').onclick=openAlerts;$('#createBtn').onclick=e=>openMenu(e.currentTarget,CREATE_ITEMS());
  $('#quickBtn').onclick=()=>openQuickSale();$('#fab').onclick=()=>openMenu($('#fab'),[{t:'Venta rápida',i:'cash',f:()=>openQuickSale()},'-',...CREATE_ITEMS()],true);
  $('#helpBtn').onclick=openHelp;$('#cfgBtn').onclick=()=>go('config');
  $('.sb-user').style.cursor='pointer';$('.sb-user').addEventListener('click',e=>{if(e.target.closest('button'))return;viewAsMenu(e.currentTarget);});
  $('#meBtn').onclick=e=>openMenu(e.currentTarget,[{t:ME.name||'Mi cuenta',i:'user',f:()=>{}},...((MODE==='demo'||isMaster()||VIEW_AS)?[{t:'Ver como otra persona…',i:'users',f:()=>viewAsMenu($('#meBtn'))}]:[]),'-',{t:'Ajustes',i:'gear',f:()=>go('config')},{t:'Cambiar tema claro/oscuro',i:'heart',f:()=>$('#themeBtn').click()},{t:'Recargar datos',i:'trend',f:()=>$('#reloadBtn').click()},...(MODE==='cloud'?[{t:'Cambiar mi contraseña',i:'gear',f:openMyPassword}]:[]),'-',{t:'Salir',i:'alert',f:()=>$('#logoutBtn').click()}]);
  $('#bottomNav').classList.remove('hidden');$('#fab').classList.remove('hidden');
  $('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';applyTheme(n);lsSet('kc_theme',n);render();};
  $('#logoutBtn').onclick=async()=>{if(MODE==='cloud'){try{await api('logout',{});}catch(e){}}location.href=location.pathname;};
  $('#reloadBtn').onclick=async()=>{if(MODE==='demo'){toast('En demo no hay nube que recargar');return;}setSync('saving','Recargando…');try{await Cloud.loadAll();setSync('synced');refreshAll();toast('Datos actualizados');}catch(e){setSync('error');}};
  const dr=$('#demoReset');if(dr)dr.onclick=resetDemo;
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==current)go(v);});
  if(canBM()&&canAdmin())await runRecurring();startRealtime();
  go(location.hash.slice(1)||'panel');
}
boot();
