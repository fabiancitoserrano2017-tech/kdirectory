<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>KDirectory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2236%2044%20280%20336%22%3E%3Cpolygon%20fill%3D%22%23F96B0E%22%20points%3D%2294%2C68%20222%2C49%20230%2C112%20100%2C118%22/%3E%3Cpolygon%20fill%3D%22%23FDB384%22%20points%3D%2242%2C120%20174%2C106%20181%2C248%2052%2C256%22/%3E%3Cpolygon%20fill%3D%22%23C75000%22%20points%3D%22172%2C104%20304%2C91%20310%2C233%20181%2C239%22/%3E%3Cpolygon%20fill%3D%22%230B0B0B%22%20points%3D%2299%2C203%20116%2C192%20158%2C261%20170%2C264%20232%2C184%20248%2C196%20176%2C290%20178%2C316%20166%2C332%20179%2C345%20184%2C376%20139%2C376%20144%2C345%20157%2C332%20146%2C316%20146%2C288%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@500;600;700;800;900&family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens · Manual de marca KASTOR ===================== */
:root{
  --navy:#1C1D22;--brand-navy:#1B2449;--azul:#3A6DAF;--celeste:#94BAC4;--naranja:#E57D37;--dorado:#EAAD62;--crema:#FAF6F2;
  --font-display:'Sofia Sans','Montserrat',system-ui,sans-serif;
  --font-head:'Montserrat','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --bg:#FAF6F2;--surface:#F3EDE6;--card:#FFFFFF;--elev:#FFFFFF;
  --border:#E9E0D6;--border-strong:#D8CBBD;
  --text:#1C1D22;--text-2:#55585F;--muted:#8E9097;
  --accent:#E57D37;--accent-hover:#D06A25;--accent-soft:rgba(229,125,55,.12);--on-accent:#FFFFFF;
  --side-bg:#FFFFFF;--side-text:#3E4148;--side-muted:#8E9097;--side-active:rgba(217,130,74,.12);--side-border:#ECE6DF;--side-strong:#1C1D22;--side-hover:#F5F0EA;
  --pos:#23845A;--pos-soft:rgba(35,132,90,.12);--neg:#C8462F;--neg-soft:rgba(200,70,47,.11);
  --warn:#B97A12;--warn-soft:rgba(234,173,98,.22);--info:#3A6DAF;--info-soft:rgba(58,109,175,.12);
  --d-design:#D9824A;--d-tech:#1B2449;--d-code:#4E9A78;--d-lab:#1B2449;--d-works:#4E9A78;--d-total:#1C1D22;
  --radius:14px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(20,35,75,.05),0 10px 28px -18px rgba(20,35,75,.28);
  --shadow-lg:0 30px 70px -20px rgba(20,35,75,.4);
  --grid-line:#E9E0D6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214;--surface:#18191C;--card:#1D1E22;--elev:#24262B;
    --border:#2C2E33;--border-strong:#3A3D44;
    --text:#F2F0EC;--text-2:#BFC1C6;--muted:#868990;
    --accent:#EE8A45;--accent-hover:#F59D5E;--accent-soft:rgba(238,138,69,.16);--on-accent:#1B1206;
    --side-bg:#0B0C0E;--side-border:#222428;--side-text:#C7C9CE;--side-muted:#7C7F87;--side-strong:#FFFFFF;--side-hover:#1A1B1F;--side-active:rgba(238,138,69,.16);--navy:#F2F0EC;
    --pos:#4FBF8B;--pos-soft:rgba(79,191,139,.15);--neg:#EF7A63;--neg-soft:rgba(239,122,99,.15);
    --warn:#EAAD62;--warn-soft:rgba(234,173,98,.16);--info:#7FA9DF;--info-soft:rgba(127,169,223,.16);
    --d-design:#EE9A62;--d-tech:#8C9BD0;--d-code:#6DBB97;--d-lab:#8C9BD0;--d-works:#6DBB97;--d-total:#F4EFE9;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -22px rgba(0,0,0,.8);--shadow-lg:0 40px 90px -20px rgba(0,0,0,.75);
    --grid-line:#243564;
  }
}
:root[data-theme="dark"]{
  --bg:#111214;--surface:#18191C;--card:#1D1E22;--elev:#24262B;
  --border:#2C2E33;--border-strong:#3A3D44;
  --text:#F2F0EC;--text-2:#BFC1C6;--muted:#868990;
  --accent:#EE8A45;--accent-hover:#F59D5E;--accent-soft:rgba(238,138,69,.16);--on-accent:#1B1206;
  --side-bg:#0B0C0E;--side-border:#222428;--side-text:#C7C9CE;--side-muted:#7C7F87;--side-strong:#FFFFFF;--side-hover:#1A1B1F;--side-active:rgba(238,138,69,.16);--navy:#F2F0EC;
  --pos:#4FBF8B;--pos-soft:rgba(79,191,139,.15);--neg:#EF7A63;--neg-soft:rgba(239,122,99,.15);
  --warn:#EAAD62;--warn-soft:rgba(234,173,98,.16);--info:#7FA9DF;--info-soft:rgba(127,169,223,.16);
  --d-design:#EE9A62;--d-tech:#8C9BD0;--d-code:#6DBB97;--d-lab:#8C9BD0;--d-works:#6DBB97;--d-total:#F4EFE9;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -22px rgba(0,0,0,.8);--shadow-lg:0 40px 90px -20px rgba(0,0,0,.75);
  --grid-line:#243564;
}

/* ===================== Base ===================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--info)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.num,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.small{font-size:12px} .xs{font-size:11px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-t{color:var(--pos)} .neg-t{color:var(--neg)} .warn-t{color:var(--warn)} .acc-t{color:var(--accent)}

/* ===================== Login / pantallas completas ===================== */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  background:radial-gradient(900px 520px at 85% -10%,rgba(229,125,55,.18),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(78,154,120,.16),transparent 60%),#141518}
.login-card .kas-badge{width:64px}
.login-card{width:400px;max-width:100%;background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:0 40px 90px -20px rgba(0,0,0,.55)}
.login-card.wide{width:560px}
.brand-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.kas-badge{width:48px;flex:0 0 auto}
.kas-badge svg,.kas-badge img,.hh-badge img{width:100%;height:auto;display:block}
.kas-img{user-select:none;-webkit-user-drag:none}
.wordmark{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.06em;color:var(--text);line-height:1}
.lema{font-family:var(--font-head);font-size:10px;letter-spacing:.24em;color:var(--accent);font-weight:700;margin-top:4px}
.login-card .sub{color:var(--muted);font-size:12.5px;margin:14px 0 22px}
.login-foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.linkish{color:var(--text-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{color:var(--accent)}
.err{color:var(--neg);font-size:12.5px;margin-top:8px;min-height:16px}
.ok{color:var(--pos);font-size:12.5px;margin-top:8px;min-height:16px}

/* ===================== Formularios y botones ===================== */
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.inp,.field input:not([type=checkbox]):not([type=color]),.field select,.field textarea{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius-sm);outline:none;min-height:42px;transition:border-color .15s,box-shadow .15s}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:76px;resize:vertical;line-height:1.45}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:600;font-size:13.5px;padding:0 16px;border-radius:var(--radius-sm);min-height:40px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,transform .1s;background:var(--accent);color:var(--on-accent);border:1px solid transparent}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%;min-height:46px;font-size:14.5px}
.btn.sm{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.xs{min-height:28px;padding:0 9px;font-size:11.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.navy{background:#1C1D22;color:#fff}
:root[data-theme="dark"] .btn.navy{background:var(--elev);border-color:var(--border-strong)}
.btn.navy:hover{background:#1d3166}
.btn.wa{background:#1FA855;color:#fff}
.btn.wa:hover{background:#178F47}
.btn.danger{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.btn.danger:hover{background:var(--neg);color:#fff}
.btn.quiet{background:transparent;color:var(--text-2);border-color:transparent}
.btn.quiet:hover{background:var(--surface);color:var(--text)}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;font-size:16px}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ===================== Layout ===================== */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;border-right:1px solid var(--side-border);background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:40}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px}
.sb-brand .kas-badge{width:38px}
.sb-brand .wordmark{color:var(--side-strong);font-size:20px}
.nav{padding:4px 12px 12px;flex:1;overflow-y:auto}
.nav .grp{font-family:var(--font-head);font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--side-muted);padding:16px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--side-text);font-weight:500;font-size:13.5px;margin-bottom:1px;cursor:pointer;transition:background-color .12s,color .12s;text-decoration:none}
.nav a svg{width:17px;height:17px;flex:0 0 auto;opacity:.75}
.nav a:hover{background:var(--side-hover);color:var(--side-strong)}
.nav a.active{background:var(--side-active);color:var(--side-strong)}
.nav a.active svg{opacity:1;color:var(--naranja)}
.nav a .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--side-hover);color:var(--side-strong);border-radius:10px;padding:1px 7px}
.nav a .cnt.hot{background:var(--naranja)}
.sb-foot{padding:12px 16px 14px;border-top:1px solid var(--side-border);font-size:12px;color:var(--side-muted)}
.sb-user{display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--font-head)}
.avatar.sm{width:22px;height:22px;font-size:9.5px}
.avatar.lab{background:var(--azul)} .avatar.works{background:var(--d-works)} .avatar.navy{background:var(--navy)}
:root[data-theme="dark"] .avatar.navy{background:var(--celeste);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar.navy{background:var(--celeste);color:var(--navy)}}
.sb-user .nm{color:var(--side-strong);font-weight:600;font-size:12.5px}
.sb-foot .sbtn{color:var(--side-muted);padding:4px 6px;border-radius:6px;font-size:12px}
.sb-foot .sbtn:hover{color:var(--side-strong);background:var(--side-hover)}
.sync{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--side-muted)}
.sync.synced .d{background:#4FBF8B}.sync.saving .d,.sync.pending .d{background:var(--dorado)}.sync.error .d{background:#EF7A63}.sync.demo .d{background:var(--celeste)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
.topbar h1{font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.topbar .crumb{font-size:12px;color:var(--muted)}
.search-trigger{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--card);color:var(--muted);min-width:240px;font-size:13px}
.search-trigger:hover{border-color:var(--accent)}
.search-trigger kbd{margin-left:auto;font-family:var(--font-body);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:1px 5px;color:var(--muted)}
.burger{display:none}
.content{padding:22px 24px 90px;width:100%;max-width:1360px}
.demo-banner{background:var(--info-soft);color:var(--info);font-size:12.5px;padding:8px 24px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.demo-banner b{font-weight:700}
.demo-banner .short{display:none}

@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .burger{display:inline-flex}
  .search-trigger{min-width:0;width:38px;padding:0;justify-content:center}
  .search-trigger span,.search-trigger kbd{display:none}
  .topbar{padding:0 16px;gap:8px}
  .topbar .crumb{display:none}
  .content{padding:16px 16px 90px}
  .demo-banner{padding:8px 16px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,17,40,.45);z-index:35}

/* ===================== Componentes ===================== */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1380px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.six .kpi .val{font-size:22px}}
.top{align-items:start}
.cols-2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}
.cols-2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1080px){.cols-3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.cols-2,.cols-2e,.cols-3{grid-template-columns:1fr}}
.mt{margin-top:14px} .mt2{margin-top:22px} .mb{margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3,.sec-h h3{font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:-.005em}
.card-h .desc,.sec-h .desc{font-size:12px;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;gap:12px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .label{font-size:11.5px;color:var(--text-2);font-weight:600}
.kpi .val{font-family:var(--font-display);font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .ico{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .ico svg{width:17px;height:17px}
.kpi.accent{background:#1C1D22;border-color:#1C1D22;color:#fff}
.kpi.accent .label{color:#F2B98F} .kpi.accent .sub{color:#B9BBC1}
:root[data-theme="dark"] .kpi.accent{background:#2A2C31;border-color:#3A3D44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.accent{background:#2A2C31;border-color:#3A3D44}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.5}
.tag.pos{background:var(--pos-soft);color:var(--pos)}.tag.neg{background:var(--neg-soft);color:var(--neg)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mut{background:var(--surface);color:var(--text-2)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.out{border:1px solid var(--border-strong);color:var(--text-2)}
.div-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.div-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-2)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.price-pill{display:inline-block;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:800;border-radius:20px;padding:3px 12px;font-size:14px;letter-spacing:.01em}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.kas-empty{width:96px;margin:0 auto 10px}.kas-empty img{width:100%;height:auto;display:block}
.empty .ill{width:46px;height:46px;margin:0 auto 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.empty .ill svg{width:22px;height:22px}
.empty .t{color:var(--text);font-weight:600;margin-bottom:4px}
.note{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--text)}
.note.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note.neg{background:var(--neg-soft);border-color:color-mix(in srgb,var(--neg) 30%,transparent)}
.note b{font-weight:700}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.progress{height:8px;background:var(--surface);border-radius:20px;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .4s}
.progress.lg{height:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}

/* Toolbar, chips, tabs */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;min-height:38px;padding:8px 11px}
.toolbar input.inp{min-width:220px}
@media (max-width:640px){.toolbar input.inp{min-width:0;flex:1 1 100%}}
.chip{font-size:12.5px;padding:0 12px;min-height:32px;border-radius:20px;border:1px solid var(--border-strong);background:var(--card);color:var(--text-2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text);border-color:var(--text-2)}
.chip.on{background:#1C1D22;color:#fff;border-color:#1C1D22}
:root[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:0 12px;min-height:30px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,35,75,.12)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 12px;font-weight:600;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
th:first-child{border-top-left-radius:var(--radius)} th:last-child{border-top-right-radius:var(--radius)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface)}
tfoot td{border-top:1px solid var(--border-strong);border-bottom:none;font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{font-size:11.5px;color:var(--muted)}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--surface);border-radius:var(--radius);padding:10px;min-height:200px;border:1px solid transparent;transition:border-color .12s,background-color .12s}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.kcol-h .t{font-family:var(--font-head);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kcol-h .s{white-space:nowrap}
.kcol-h .n{font-size:11px;color:var(--muted);font-weight:600}
.kcol-h .s{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(20,35,75,.05);transition:border-color .12s,transform .12s}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.kcard.dragging{opacity:.45}
.kcard .tt{font-weight:600;font-size:13px;line-height:1.3}
.kcard .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.kcard .amt{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--text);margin-left:auto;white-space:nowrap}
.kcard .warnline{margin-top:7px;font-size:11px;color:var(--warn);font-weight:600}

/* Drawer y modal */
.overlay{position:fixed;inset:0;background:rgba(10,17,40,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:28px 16px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{font-family:var(--font-head);font-size:16px;font-weight:700}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.x{font-size:22px;color:var(--text-2);line-height:1;padding:2px 8px;border-radius:8px}
.x:hover{background:var(--surface);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.form-grid .full{grid-column:1/-1}
@media(max-width:640px){.form-grid,.form-grid.three{grid-template-columns:1fr}}
.drawer-ov{position:fixed;inset:0;background:rgba(10,17,40,.42);z-index:55;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:56;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--card)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 40px}
.drawer-h h2{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.15}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px}
.prop .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.prop .v{font-size:13.5px;font-weight:500;margin-top:2px}
.stage-bar{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.stage-bar button{flex:1;min-width:84px;font-size:11.5px;font-weight:700;padding:7px 6px;border-radius:8px;background:var(--surface);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage-bar button.done{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--text)}
.stage-bar button.on{background:var(--accent);color:#fff}
.stage-bar button.lost.on{background:var(--neg)}

/* Línea de tiempo */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item .bul{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center}
.tl-item .bul.whatsapp{border-color:#1FA855}.tl-item .bul.etapa{border-color:var(--azul)}.tl-item .bul.llamada{border-color:var(--d-works)}
.tl-item .h{font-size:11.5px;color:var(--muted)}
.tl-item .h b{color:var(--text-2)}
.tl-item .bd{font-size:13px;margin-top:2px;white-space:pre-wrap}
.composer{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:16px}
.composer textarea{width:100%;border:none;outline:none;resize:vertical;min-height:54px;background:transparent;font-size:13.5px}

/* Catálogo */
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.prod{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.prod:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.prod .ph{aspect-ratio:4/3;background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prod .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prod .ph .noimg{color:var(--muted);opacity:.6}
.prod .ph .noimg svg{width:34px;height:34px}
.prod .ph .tl{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.prod .ph .tr{position:absolute;top:8px;right:8px}
.prod .ph .tag{background:color-mix(in srgb,var(--card) 92%,transparent)}
.prod .body{padding:11px 13px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.prod .nm{font-family:var(--font-head);font-weight:600;font-size:13.5px;line-height:1.3}
.prod .mrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:10px}
.prod .m .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.prod .m .v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.calc-box{background:var(--surface);border-radius:14px;padding:14px 16px}
.calc-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.calc-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--border);color:var(--text-2)}
.calc-row .v{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.calc-row.total{border-bottom:none;border-top:1px solid var(--border-strong);margin-top:6px;padding-top:9px;font-weight:700;font-size:14.5px;color:var(--text)}
.calc-row.total .v{color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.metrics .m{background:var(--card);border-radius:10px;padding:9px;text-align:center}
.metrics .m .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.metrics .m .v{font-family:var(--font-display);font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.photo-drop{border:2px dashed var(--border-strong);border-radius:12px;aspect-ratio:4/3;max-height:220px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--surface);position:relative;font-size:12.5px;gap:6px}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-drop:hover{border-color:var(--accent);color:var(--accent)}
.color-dots{display:flex;gap:4px;flex-wrap:wrap}
.color-dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--border-strong);display:block}

/* Líneas de pedido */
.lines td{padding:7px 6px}
.lines input,.lines select{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);min-height:34px}
.lines input:focus,.lines select:focus{border-color:var(--accent);outline:none}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.cal .dow{background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px;text-align:center;border-bottom:1px solid var(--border)}
.cal .day{min-height:108px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;font-size:11.5px;position:relative}
.cal .day:nth-child(7n){border-right:none}
.cal .day.out{background:color-mix(in srgb,var(--surface) 50%,var(--card));color:var(--muted)}
.cal .day.today .dn{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal .dn{font-weight:700;font-size:12px;margin-bottom:4px;display:inline-block}
.cal .ev{display:block;width:100%;text-align:left;border-radius:6px;padding:2px 6px;margin-bottom:3px;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal .ev.comercial,.cal .ev.feria{background:var(--accent-soft);color:var(--accent)}
.cal .ev.campaña,.cal .ev.interno{background:var(--info-soft);color:var(--info)}
.cal .ev.content{background:color-mix(in srgb,var(--celeste) 30%,transparent);color:var(--text)}
.cal .ev.task{background:var(--surface);color:var(--text-2)}
.cal .ev.deal{background:var(--pos-soft);color:var(--pos)}
@media (max-width:760px){.cal .day{min-height:70px;padding:4px}.cal .ev{font-size:0;height:6px;padding:0;margin-bottom:2px}}

/* Paleta de búsqueda */
.palette{position:fixed;inset:0;z-index:90;background:rgba(10,17,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette .box{width:620px;max-width:100%;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--border)}
.palette input{width:100%;border:none;outline:none;padding:16px 18px;font-size:16px;background:transparent;border-bottom:1px solid var(--border)}
.palette .res{max-height:56vh;overflow-y:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
.palette .it.sel,.palette .it:hover{background:var(--surface)}
.palette .it .ty{margin-left:auto;font-size:11px;color:var(--muted)}
.palette .gh{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 12px 4px;font-weight:700}

/* Menús */
.menu{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:80;min-width:210px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500}
.menu button:hover{background:var(--surface)}
.menu button svg{width:16px;height:16px;color:var(--text-2)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
.alert-item{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:13px;align-items:flex-start;cursor:pointer}
.alert-item:hover{background:var(--surface)}
.alert-item .ai{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.alert-item .ai svg{width:15px;height:15px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:#1C1D22;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--neg)}

/* Listas simples */
.list-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-row .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--border-strong);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.task-row .ck:hover{border-color:var(--accent)}
.task-row.done .ck{background:var(--pos);border-color:var(--pos)}
.task-row.done .tt{text-decoration:line-through;color:var(--muted)}
.task-row .tt{font-weight:500;font-size:13.5px;cursor:pointer}
.task-row .tt:hover{color:var(--accent)}

/* Mascota */
#kas-buddy{position:fixed;right:18px;bottom:16px;z-index:44;display:flex;flex-direction:column;align-items:flex-end;gap:6px;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s}
#kas-buddy.off{transform:translateY(140px);opacity:0;pointer-events:none}
.kas-bubble{max-width:220px;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px 12px 4px 12px;font-size:12px;color:var(--text-2);line-height:1.45;box-shadow:var(--shadow)}
.kas-bubble b{color:var(--accent)}
.kas-sprite{width:58px;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(229,125,55,.3));transition:transform .18s}
.kas-sprite svg{width:100%;height:auto;display:block;image-rendering:pixelated}
.kas-sprite:hover{transform:translateY(-2px)}
.kas-float{animation:kf 3.4s ease-in-out infinite}
@keyframes kf{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.kas-float{animation:none}}
@media (max-width:760px){#kas-buddy{display:none}}
@media print{.sidebar,.topbar,.bottom-nav,.fab,.toolbar,.demo-banner{display:none !important}.content{padding:0}}




/* ===================== Logo KDirectory ===================== */
.kd-logo{display:flex;align-items:center;gap:10px}
.kd-icon{width:40px;flex:0 0 auto;display:block;color:#0B0B0B}
:root[data-theme="dark"] .kd-icon{color:#F2F0EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kd-icon{color:#F2F0EC}}
.login-card .kd-icon{color:#0B0B0B}.kd-icon svg{width:100%;height:auto;display:block}
.kd-bar{width:2px;align-self:stretch;margin:2px 0;background:#F96B0E;border-radius:2px}
.kd-txt{display:flex;flex-direction:column;line-height:1}
.kd-k{font-family:var(--font-head);font-weight:600;font-size:10px;letter-spacing:.42em;color:var(--side-strong,#0B0B0B)}
.kd-n{font-family:var(--font-display);font-weight:900;font-size:24px;color:#F96B0E;letter-spacing:-.01em;margin-top:3px}
.kd-logo.lg{gap:16px;margin-bottom:6px}.kd-logo.lg .kd-icon{width:62px}.kd-logo.lg .kd-k{font-size:12px;color:var(--text)}.kd-logo.lg .kd-n{font-size:34px}
.sb-brand{padding:20px 18px 14px}
/* ===================== Líneas de negocio ===================== */
.nav .line-item .line-dot{width:10px;height:10px;border-radius:3px;background:var(--lc);margin:0 4px 0 4px;flex:0 0 auto}
.nav .main-item.line-item.active{background:color-mix(in srgb,var(--lc) 15%,transparent)}
.nav .line-item.active span:not(.line-dot):not(.ro-pill){color:var(--side-strong)}
.nav .ro-pill{margin-left:auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--side-muted);border:1px solid var(--side-border);border-radius:10px;padding:0 6px}
.subtabs .line-dot{width:8px;height:8px;border-radius:2px;background:var(--lc)}
.subtabs button.on[style*="--lc"]{border-bottom-color:var(--lc)}
.role-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 8px;color:var(--text-2)}
.hub{--accent:var(--lc);--accent-hover:color-mix(in srgb,var(--lc) 82%,#000);--accent-soft:color-mix(in srgb,var(--lc) 13%,transparent)}
.hub-hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 26px;color:#fff;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:0 22px 44px -26px rgba(0,0,0,.5)}
.hh-main{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1}
.hh-brand{display:flex;gap:14px;align-items:center}
.hh-badge{width:104px;height:84px;border-radius:18px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;padding:6px 8px;box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.hh-badge img{max-height:72px;width:auto !important;max-width:100%}
.hh-badge svg{width:100%;height:auto;image-rendering:pixelated}
.hh-k{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.12em;opacity:.85}
.hh-n{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:.95;letter-spacing:.02em}
.hh-pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 12px}
.hh-model ul{list-style:none;margin-top:10px;display:grid;gap:4px}
.hh-model li{font-size:13.5px;display:flex;gap:8px;align-items:center;opacity:.95}
.hh-model li::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8}
.hh-side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:flex-start;position:relative;z-index:1}
.hh-btn{background:#fff !important;color:var(--lch) !important;border-color:#fff !important;min-width:150px}

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const pad2=n=>String(n).padStart(2,'0');
const localISO=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>localISO(new Date());
const nowISO=()=>new Date().toISOString();
const monthKey=iso=>(iso||todayISO()).slice(0,7);
const nowMonth=()=>monthKey(todayISO());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localISO(d);};
const addMonths=(mk,n)=>{const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad2(d.getMonth()+1);};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const lastMonths=n=>{const out=[];for(let i=n-1;i>=0;i--)out.push(addMonths(nowMonth(),-i));return out;};
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monthLabel=mk=>{const [y,m]=mk.split('-');return MES[+m-1]+' '+y;};
const monthLong=mk=>{const [y,m]=mk.split('-');return MESL[+m-1]+' '+y;};
const fmtDate=iso=>{if(!iso)return '—';const s=String(iso).slice(0,10);const [y,m,d]=s.split('-');return (+d)+' '+MES[+m-1]+(y!==String(new Date().getFullYear())?' '+y:'');};
const relDay=iso=>{if(!iso)return '';const n=daysBetween(todayISO(),String(iso).slice(0,10));if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';return n>0?'en '+n+' días':'hace '+(-n)+' días';};
const ago=ts=>{if(!ts)return '';const s=(Date.now()-new Date(ts).getTime())/1000;if(s<60)return 'recién';if(s<3600)return 'hace '+Math.floor(s/60)+' min';if(s<86400)return 'hace '+Math.floor(s/3600)+' h';return 'hace '+Math.floor(s/86400)+' d';};
const N=v=>Number(v)||0;
function fmtBs(n,dec){n=N(n);const d=dec!=null?dec:(Math.abs(n)>=1000?0:2);return 'Bs '+n.toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d});}
const fmtN=(n,d=0)=>N(n).toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtUSD=n=>'USD '+N(n).toLocaleString('es-BO',{maximumFractionDigits:0});
const fmtPct=(n,d=0)=>fmtN(n,d)+'%';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const sum=(arr,f)=>arr.reduce((a,x)=>a+N(typeof f==='function'?f(x):x[f]),0);
const groupBy=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);(m[k]=m[k]||[]).push(x);return m;},{});
const byId=(k,id)=>id?DB[k].find(x=>x.id===id):null;
const debounce=(fn,ms)=>{let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast show'+(kind==='err'?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast'+(kind==='err'?' err':''),kind==='err'?4200:2000);}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};
const phoneDigits=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===8)d='591'+d;return d;};

  if(!r.ok||j.error){const e=new Error(j&&j.error||('Error '+r.status));e.status=r.status;throw e;}
  return j;
}

/* ---------- Generar gastos recurrentes del mes ---------- */
async function runRecurring(){
  const today=todayISO(),cur=nowMonth(),made=[];
  for(const r of DB.recurring.filter(x=>x.active)){
    let mk=r.start_month&&r.start_month<=cur?r.start_month:cur;
    if(mk<addMonths(cur,-2))mk=addMonths(cur,-2);
    for(;mk<=cur;mk=addMonths(mk,1)){
      if(DB.expenses.some(e=>e.recurring_id===r.id&&e.period===mk))continue;
      const [y,m]=mk.split('-').map(Number);const last=new Date(y,m,0).getDate();const day=Math.min(Math.max(1,N(r.day)||1),last);
      const date=mk+'-'+pad2(day);if(date>today)continue;
      made.push({id:uuid(),date,category:r.category,description:r.description,payee:r.payee,amount_bs:r.amount_bs,division:r.division,recurring_id:r.id,period:mk});
    }
  }
  for(const e of made){try{await save('expenses',e);}catch(err){DB.expenses=DB.expenses.filter(x=>x.id!==e.id);}}
  if(made.length)toast(made.length+' gasto(s) recurrente(s) registrados');
}

function costOf(p){
  const rate=(p.filament_rate!=null&&p.filament_rate!=='')?N(p.filament_rate):S.filamentRate;
  const h=N(p.print_time_h);
  const filamento=N(p.weight_g)*rate, purga=filamento*N(p.purge_pct)/100;
  const insumos=N(p.insumos_bs), empaque=N(p.empaque_bs), elec=h*S.elecRate, maq=h*S.maqRate;
  const diseno=N(p.diseno_h)*S.disenoRate/Math.max(1,S.designAmortUnits), mano=N(p.mano_obra_bs), post=N(p.post_h)*S.disenoRate;
  const sub=filamento+purga+insumos+empaque+elec+maq+diseno+mano+post, merma=sub*N(p.merma_pct)/100, total=sub+merma;
  const price=N(p.price_bs), ganancia=price-total, margen=price>0?ganancia/price*100:0, bsh=h>0?price/h:0, gph=h>0?ganancia/h:0, mult=total>0?price/total:0;
  const incompleto=p.division==='code'?!(N(p.mano_obra_bs)>0||N(p.diseno_h)>0||N(p.insumos_bs)>0):!(N(p.weight_g)>0&&h>0);
  return {filamento,purga,insumos,empaque,elec,maq,diseno,mano,post,merma,total,price,ganancia,margen,bsh,gph,mult,incompleto};
}
const itemsOf=dealId=>DB.items.filter(i=>i.deal_id===dealId).sort((a,b)=>N(a.sort)-N(b.sort));
const paymentsOf=dealId=>DB.payments.filter(p=>p.deal_id===dealId);
function dealCalc(d){
  const items=itemsOf(d.id);
  const sub=items.length?sum(items,i=>N(i.qty)*N(i.unit_price_bs)):N(d.amount_manual_bs);
  const net=sub-N(d.discount_bs), total=net+N(d.shipping_bs);
  const cost=sum(items,i=>N(i.qty)*N(i.unit_cost_bs)), hours=sum(items,i=>N(i.qty)*N(i.unit_hours)), grams=sum(items,i=>N(i.qty)*N(i.unit_grams));
  const paid=sum(paymentsOf(d.id),'amount_bs'), balance=total-paid;
  const margin=net-cost, marginPct=net>0?margin/net*100:0;
  const units=sum(items,'qty');
  return {items,sub,net,total,cost,hours,grams,paid,balance,margin,marginPct,units,bsh:hours>0?net/hours:0};
}

function monthFin(mk){
  const pays=DB.payments.filter(p=>inMonth(p.date,mk)), exps=DB.expenses.filter(e=>inMonth(e.date,mk));
  const ingresos=sum(pays,'amount_bs'), gastos=sum(exps,'amount_bs');

  const capex=sum(exps.filter(e=>CAPEX_CATS.includes(e.category)),'amount_bs');
  const fijos=gastos-variables-capex;
  const byDiv={};DIVS.forEach(d=>byDiv[d]=0);byDiv.none=0;pays.forEach(p=>{const d=payDivision(p);byDiv[d&&byDiv[d]!=null?d:'none']+=N(p.amount_bs);});
  return {ingresos,gastos,variables,fijos,capex,utilidad:ingresos-gastos,margen:ingresos>0?(ingresos-gastos)/ingresos*100:0,byDiv,pays,exps};
}

  const caja=cobrado-gastado-repartido;
  const collabOwed=sum(collabLedger(),'pending');
  const reserva=Math.max(0,caja-collabOwed-S.cashBuffer)*S.reservePct/100;
  const disponible=Math.max(0,caja-collabOwed-S.cashBuffer-reserva);
  return {cobrado,gastado,repartido,caja,collabOwed,buffer:S.cashBuffer,reserva,disponible};
}
/* Colaboradoras: % del margen neto de pedidos entregados y pagados */
function collabLedger(){
  return DB.team.filter(m=>m.role==='colaboradora').map(m=>{
    let earned=0;const deals=[];
    DB.deals.filter(d=>d.stage==='entregado').forEach(d=>{const part=(d.collaborators||[]).find(c=>c.member_id===m.id);if(!part)return;const c=dealCalc(d);if(c.balance>0.5)return;const amt=Math.max(0,c.margin)*N(part.pct)/100;earned+=amt;deals.push({d,amt});});
    const paid=sum(DB.expenses.filter(e=>e.team_member_id===m.id&&e.category==='Colaboradoras'),'amount_bs');
    return {m,earned,paid,pending:Math.max(0,earned-paid),deals};
  });
}
/* Contribución media por unidad (ventas entregadas 120 días; si no hay, el catálogo) */
function avgContribution(){
  const since=addDays(todayISO(),-120);const its=[];
  DB.deals.filter(d=>['entregado','produccion','pagado'].includes(d.stage)&&String(d.created_at).slice(0,10)>=since).forEach(d=>itemsOf(d.id).forEach(i=>its.push(i)));
  const u=sum(its,'qty');
  if(u>0)return {v:sum(its,i=>N(i.qty)*(N(i.unit_price_bs)-N(i.unit_cost_bs)))/u,src:'ventas de los últimos 120 días'};
  const ps=DB.products.filter(p=>p.active!==false&&N(p.price_bs)>0).map(costOf).filter(c=>!c.incompleto);
  return {v:ps.length?sum(ps,'ganancia')/ps.length:0,src:'promedio del catálogo'};
}
/* Capacidad de la impresora */
function capacityFor(mk){
  const cap=S.horasMes, plan=cap*S.ocupacion/100;
  const jobs=DB.jobs.filter(j=>j.status!=='fallido'&&(inMonth(j.date,mk)||(!j.date&&j.status!=='hecho'&&mk===nowMonth())||(j.status==='hecho'&&inMonth(j.done_at,mk)&&!j.date)));
  const used=sum(jobs,'hours');
  let pipe=0;if(mk===nowMonth()||mk===addMonths(nowMonth(),1)){DB.deals.filter(d=>['cotizado','pagado','produccion'].includes(d.stage)).forEach(d=>{const jh=sum(DB.jobs.filter(j=>j.deal_id===d.id),'hours');const h=Math.max(0,dealCalc(d).hours-jh);pipe+=h*STAGE[d.stage].p/100;});if(mk!==nowMonth())pipe=0;}
  return {cap,plan,used,pipe,pct:cap>0?used/cap*100:0,pctProj:cap>0?(used+pipe)/cap*100:0};
}
function goalFor(mk,division,metric){return DB.goals.find(g=>g.period===mk&&g.division===division&&g.metric===metric);}
function goalActual(mk,division,metric){
  if(metric==='ingresos'){const f=monthFin(mk);return division==='total'?f.ingresos:f.byDiv[division]||0;}
  if(metric==='pedidos')return DB.deals.filter(d=>['pagado','produccion','entregado'].includes(d.stage)&&inMonth(d.closed_at||d.stage_changed_at,mk)&&(division==='total'||d.division===division)).length;
  if(metric==='leads')return DB.contacts.filter(c=>inMonth(c.created_at,mk)).length;
  if(metric==='horas')return capacityFor(mk).used;
  return 0;
}

/* ---------- Alertas (la campana) ---------- */
function computeAlerts(){
  const out=[],today=todayISO();
  DB.tasks.filter(t=>t.status!=='hecha'&&t.due&&t.due<today).forEach(t=>out.push({k:'neg',i:'check',t:'Tarea vencida: '+t.title,s:'Venció '+relDay(t.due)+(t.assignee_id?' · '+memberName(t.assignee_id):''),go:()=>openTask(t.id)}));
  DB.tasks.filter(t=>t.status!=='hecha'&&t.due===today).forEach(t=>out.push({k:'warn',i:'check',t:'Para hoy: '+t.title,s:t.assignee_id?memberName(t.assignee_id):'',go:()=>openTask(t.id)}));
  DB.deals.filter(d=>['nuevo','cotizado'].includes(d.stage)).forEach(d=>{const n=dealIdleDays(d);if(n>=S.staleDays)out.push({k:'warn',i:'funnel',t:dealName(d)+' sin seguimiento',s:n+' días sin actividad · '+STAGE[d.stage].n,go:()=>openDeal(d.id)});});
  DB.deals.filter(d=>d.stage==='entregado').forEach(d=>{const c=dealCalc(d);if(c.balance>0.5)out.push({k:'neg',i:'cash',t:'Saldo por cobrar: '+dealName(d),s:fmtBs(c.balance)+' pendiente',go:()=>openDeal(d.id)});});
  DB.deals.filter(d=>OPEN_STAGES.includes(d.stage)&&d.delivery_date&&d.delivery_date<today).forEach(d=>out.push({k:'neg',i:'clock',t:'Entrega atrasada: '+dealName(d),s:'Comprometida '+fmtDate(d.delivery_date),go:()=>openDeal(d.id)}));
  DB.filaments.filter(f=>f.active!==false&&N(f.stock_g)<N(f.min_g)).forEach(f=>out.push({k:'warn',i:'spool',t:'Filamento bajo: '+f.material+' '+f.color,s:fmtN(f.stock_g)+' g (mínimo '+fmtN(f.min_g)+' g)',go:()=>go('inventario')}));
  DB.events.filter(e=>e.type!=='interno'&&e.date>=today&&daysBetween(today,e.date)<=21).forEach(e=>{const n=daysBetween(today,e.date);const hasContent=DB.content.some(c=>c.event_id===e.id);if(!hasContent)out.push({k:'info',i:'mega',t:e.name+' '+relDay(e.date),s:'Aún sin contenido planificado para la fecha',go:()=>go('calendario')});});
  const cap=capacityFor(nowMonth());if(cap.pctProj>=S.printer2Threshold)out.push({k:'neg',i:'printer',t:'Impresora al '+fmtPct(cap.pctProj)+' (proyectado)',s:'Supera el umbral de '+S.printer2Threshold+'% · evalúa la 2.ª impresora',go:()=>go('produccion')});
  return out;
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function donut(data,size=148,thick=22,label='Bs'){
  const total=data.reduce((a,d)=>a+d.value,0)||1;const r=(size-thick)/2,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0;
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cssVar('--surface')}" stroke-width="${thick}"/>`;
  data.forEach(d=>{const len=d.value/total*C;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;});
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">${s}<text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="15" font-weight="800" fill="${cssVar('--text')}" font-family="Sofia Sans,sans-serif">${fmtN(total)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="${cssVar('--muted')}" font-family="Inter,sans-serif">${label}</text></svg>`;
}
function barsChart(labels,series,{h=190,line}={}){
  const W=Math.max(360,labels.length*64),pad=30,bot=24,n=series.length,bw=Math.min(16,(W-pad*2)/labels.length/(n+1));
  const vals=series.flatMap(s=>s.data).concat(line?line.data:[]);const max=Math.max(1,...vals);const minV=Math.min(0,...vals);const range=max-minV;
  const y=v=>h-bot-((v-minV)/range)*(h-bot-14);const step=(W-pad*2)/labels.length;let g='';
  const grid=cssVar('--grid-line'),mut=cssVar('--muted');
  (minV<0?[minV,0,max]:[0,max/2,max]).filter(v=>!(minV<0&&v===minV&&Math.abs(y(minV)-y(0))<14)).forEach(v=>{g+=`<line x1="${pad}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="${grid}" stroke-dasharray="${v===0?'':'3 4'}"/><text x="${pad-6}" y="${y(v)+3}" text-anchor="end" font-size="9.5" fill="${mut}" font-family="Inter">${v>=1000?fmtN(v/1000,1)+'k':fmtN(v)}</text>`;});
  labels.forEach((l,i)=>{const x0=pad+i*step+step/2-(n*bw+(n-1)*3)/2;
    series.forEach((s,j)=>{const v=s.data[i]||0;const top=y(Math.max(0,v)),bt=y(Math.min(0,v));g+=`<rect x="${x0+j*(bw+3)}" y="${top}" width="${bw}" height="${Math.max(1,bt-top)}" rx="3" fill="${s.color}"><title>${esc(s.name)} ${esc(l)}: ${fmtBs(v)}</title></rect>`;});
    g+=`<text x="${pad+i*step+step/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="${mut}" font-family="Inter">${esc(l)}</text>`;});
  if(line){const pts=line.data.map((v,i)=>`${pad+i*step+step/2},${y(v)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="${line.color}" stroke-width="2.2" stroke-linejoin="round"/>`+line.data.map((v,i)=>`<circle cx="${pad+i*step+step/2}" cy="${y(v)}" r="3" fill="${line.color}"/>`).join('');}
  return `<svg width="100%" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>`;
}
function hbars(rows){const max=Math.max(1,...rows.map(r=>r.value));
  return `<div class="stack" style="gap:11px">${rows.map(r=>`<div><div class="row between small" style="margin-bottom:4px"><span class="ell b" style="max-width:70%">${r.label}</span><span class="t2 num">${r.extra||fmtBs(r.value)}</span></div><div class="progress"><i style="width:${Math.max(0,r.value)/max*100}%;background:${r.color||'var(--accent)'}"></i></div></div>`).join('')}</div>`;}

function resizeImage(file,maxDim){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;}else if(h>maxDim){w=w*maxDim/h;h=maxDim;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.toBlob(b=>res(b),'image/jpeg',.84);};img.onerror=rej;img.src=e.target.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportCSV(name,headers,rows){const q=c=>{c=String(c==null?'':c);return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;};
  const csv=[headers.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\n');downloadBlob(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),name+'.csv');toast('CSV exportado');}
function parseCSV(text){const rows=[];let row=[],f='',q=false;const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===sep){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}

async function saveQuickSale(st){
  const lines=st.lines.filter(l=>l.pid||l.desc||N(l.price)>0);
  if(!lines.length){toast('Agrega al menos un producto','err');return;}
  if(lines.some(l=>!l.pid&&!String(l.desc).trim())){toast('Escribe qué es el producto que no está en el catálogo','err');return;}
  const total=st.total();if(total<=0){toast('El total debe ser mayor a 0','err');return;}
  let paid=st.pay==='todo'?total:st.pay==='mitad'?Math.round(total/2):st.pay==='otro'?N(numv('qs_amt')):0;
  if(st.pay==='otro'&&paid<=0){toast('Escribe cuánto pagó','err');return;}
  paid=Math.min(paid,total);
  // 1) cliente
  let c=st.contact;const name=val('qs_n'),phone=val('qs_p');
  if(!c&&name)c=await save('contacts',{name,phone,lifecycle:'prospecto',source:val('qs_src'),owner_id:val('qs_o')||null,tags:[]});
  else if(c&&phone&&!c.phone)c=await save('contacts',{...c,phone});
  // 2) pedido
  const p0=byId('products',lines[0].pid);
  const label=l=>{const p=byId('products',l.pid);return p?p.name:String(l.desc).trim();};
  const title=val('qs_t')||(label(lines[0])+(N(lines[0].qty)>1?' ×'+N(lines[0].qty):'')+(lines.length>1?' y '+(lines.length-1)+' más':''));
  const hasPrint=lines.some(l=>{const p=byId('products',l.pid);return p&&N(p.print_time_h)>0;});
  const queue=!st.delivered&&hasPrint&&$('#qs_q').checked;
  const stage=st.delivered?'entregado':paid>0?(queue?'produccion':'pagado'):'cotizado';
  const now=nowISO();
  const d=await save('deals',{title,contact_id:c?c.id:null,company_id:c&&c.company_id||null,division:p0?p0.division:'design',stage,source:val('qs_src'),owner_id:val('qs_o')||null,
    delivery_date:st.delivered?todayISO():(val('qs_dd')||null),discount_bs:N(numv('qs_disc')),shipping_bs:N(numv('qs_ship')),collaborators:[],personalization:val('qs_pers')||null,stage_changed_at:now,closed_at:paid>0||st.delivered?now:null});
  // 3) líneas
  for(let k=0;k<lines.length;k++){const l=lines[k],p=byId('products',l.pid);const cc=p?costOf(p):null;
    await save('items',{deal_id:d.id,product_id:p?p.id:null,description:p?'':String(l.desc).trim(),qty:N(l.qty)||1,unit_price_bs:N(l.price),unit_cost_bs:cc?+cc.total.toFixed(2):0,unit_hours:p?N(p.print_time_h):0,unit_grams:p?N(p.weight_g):0,sort:k});}
  // 4) cobro
  if(paid>0)await save('payments',{deal_id:d.id,date:todayISO(),amount_bs:paid,method:st.method,kind:paid>=total-0.5?'pago':'anticipo'});
  // 5) cola de impresión
  let nj=0;if(queue)for(let k=0;k<lines.length;k++){const l=lines[k],p=byId('products',l.pid);if(!p||!(N(p.print_time_h)>0))continue;const hrs=+(N(p.print_time_h)*N(l.qty)).toFixed(2);
    await save('jobs',{deal_id:d.id,product_id:p.id,title:p.name+(N(l.qty)>1?' ×'+N(l.qty):''),qty:N(l.qty),hours:hrs,grams:Math.round(N(p.weight_g)*N(l.qty)*(1+N(p.purge_pct)/100)),slot:hrs<=1?'noche':hrs>=6?'finde':'dia',date:todayISO(),status:'cola',sort:k});nj++;}
  // 6) historial y ciclo del cliente
  await save('activities',{type:'etapa',body:'Venta rápida · '+STAGE[stage].n+(paid>0?' · cobrado '+fmtBs(paid):''),deal_id:d.id,contact_id:c?c.id:null,author:ME.name,at:now});
  if(c&&(paid>0||st.delivered)){const prevWon=DB.deals.filter(x=>x.contact_id===c.id&&x.id!==d.id&&['pagado','produccion','entregado'].includes(x.stage)).length;const lc=prevWon>=1?'recurrente':'cliente';if(c.lifecycle!==lc&&c.lifecycle!=='recurrente')await save('contacts',{...c,lifecycle:lc});}
  closeModal();
  const saldo=total-paid;
  toast('Pedido #'+(byId('deals',d.id)||d).number+' guardado'+(saldo>0.5?' · falta cobrar '+fmtBs(saldo,0):'')+(nj?' · '+nj+' en la cola':''));
  refreshAll();
}

const WON=['pagado','produccion','entregado'];
function hubStats(div){
  const mk=nowMonth(),deals=DB.deals.filter(d=>d.division===div),open=deals.filter(d=>OPEN_STAGES.includes(d.stage)),won=deals.filter(d=>WON.includes(d.stage));
  const pays=DB.payments.filter(p=>payDivision(p)===div);
  const cobMes=sum(pays.filter(p=>inMonth(p.date,mk)),'amount_bs'),cobPrev=sum(pays.filter(p=>inMonth(p.date,addMonths(mk,-1))),'amount_bs');
  const porCobrar=sum(won,d=>Math.max(0,dealCalc(d).balance));
  const ticket=won.length?sum(won,d=>dealCalc(d).total)/won.length:0;
  const openBs=sum(open,d=>dealCalc(d).total);
  const ms=lastMonths(6),serie=ms.map(m=>sum(pays.filter(p=>inMonth(p.date,m)),'amount_bs'));
  const goal=goalFor(mk,div,'ingresos');
  return {deals,open,won,pays,cobMes,cobPrev,porCobrar,ticket,openBs,ms,serie,goal};
}

async function moveStage(id,stage,silent){
  const d=byId('deals',id);if(!d||d.stage===stage)return;
  if(stage==='perdido'&&!silent){openLostDialog(d);return;}
  const from=d.stage;const row={...d,stage,stage_changed_at:nowISO()};
  if(['pagado','produccion','entregado'].includes(stage)&&!d.closed_at)row.closed_at=nowISO();
  if(stage==='entregado'&&!d.delivery_date)row.delivery_date=todayISO();
  await save('deals',row);
  await save('activities',{type:'etapa',body:`Etapa: ${STAGE[from].n} → ${STAGE[stage].n}`,deal_id:id,contact_id:d.contact_id,author:ME.name,at:nowISO()});
  if(d.contact_id&&['pagado','produccion','entregado'].includes(stage)){const ct=byId('contacts',d.contact_id);if(ct&&['lead','prospecto'].includes(ct.lifecycle)){await save('contacts',{...ct,lifecycle:'cliente'});}
    else if(ct&&ct.lifecycle==='cliente'&&DB.deals.filter(x=>x.contact_id===ct.id&&['pagado','produccion','entregado'].includes(x.stage)).length>=2)await save('contacts',{...ct,lifecycle:'recurrente'});}
  toast(STAGE[stage].n);
  if(stage==='produccion'&&!DB.jobs.some(j=>j.deal_id===id)&&itemsOf(id).length){refreshAll();openJobsFromDeal(id);return;}
  if(stage==='pagado'&&dealCalc(row).paid<=0){refreshAll();openPayment(null,id);return;}
  refreshAll();
}
function openLostDialog(d){
  openModal({title:'Marcar como perdido',body:`<div class="field"><label>¿Por qué se perdió?</label><select id="lr">${['Precio','Plazo de entrega','No respondió','Compró a otro','Solo consultaba','Otro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Detalle (opcional)</label><input id="lrd"></div>`,saveLabel:'Marcar perdido',
    onSave:async()=>{const reason=val('lr')+(val('lrd')?': '+val('lrd'):'');await save('deals',{...d,stage:'perdido',lost_reason:reason,stage_changed_at:nowISO()});await save('activities',{type:'etapa',body:'Perdido · '+reason,deal_id:d.id,contact_id:d.contact_id,author:ME.name,at:nowISO()});closeModal();toast('Pedido perdido');refreshAll();}});
}
